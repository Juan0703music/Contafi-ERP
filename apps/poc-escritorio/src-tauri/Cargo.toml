[package]
name = "contafi-poc"
version = "0.1.0"
description = "Contafi — prueba de concepto de escritorio (Fase 0)"
edition = "2021"

[lib]
name = "contafi_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "bundled" compila SQLite dentro del ejecutable. SQLCipher (cifrado) llega en la Fase 3.
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
