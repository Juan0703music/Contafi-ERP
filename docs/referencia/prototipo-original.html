<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contafi ERP — Núcleo Contable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  --paper:#F2F4EF;
  --surface:#FFFFFF;
  --surface-2:#E9ECE4;
  --ink:#16211B;
  --ink-soft:#4B5750;
  --ink-faint:#7C877F;
  --line:#D7DACE;
  --line-strong:#B9BEAE;
  --accent:#1F5D4E;
  --accent-ink:#F2F4EF;
  --accent-soft:#DCE7E1;
  --warn:#8A5A1E;
  --warn-soft:#F1E3CC;
  --danger:#8E332B;
  --danger-soft:#F3DAD6;
  --debit:#1F5D4E;
  --credit:#7A3B12;
  --shadow: 0 1px 0 rgba(22,33,27,0.04);
}
:root[data-theme="dark"]{
  --paper:#10150F;
  --surface:#161C15;
  --surface-2:#1E2620;
  --ink:#E7ECE4;
  --ink-soft:#AEB8AC;
  --ink-faint:#7C877F;
  --line:#2B342C;
  --line-strong:#3B453C;
  --accent:#4E9A85;
  --accent-ink:#0C1410;
  --accent-soft:#1D332C;
  --warn:#D8A868;
  --warn-soft:#332816;
  --danger:#D98D82;
  --danger-soft:#3A211D;
  --debit:#5FAF9A;
  --credit:#D3A06E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10150F;
    --surface:#161C15;
    --surface-2:#1E2620;
    --ink:#E7ECE4;
    --ink-soft:#AEB8AC;
    --ink-faint:#7C877F;
    --line:#2B342C;
    --line-strong:#3B453C;
    --accent:#4E9A85;
    --accent-ink:#0C1410;
    --accent-soft:#1D332C;
    --warn:#D8A868;
    --warn-soft:#332816;
    --danger:#D98D82;
    --danger-soft:#3A211D;
    --debit:#5FAF9A;
    --credit:#D3A06E;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; height:100%; background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Source Serif 4', Georgia, 'Times New Roman', serif;}
.mono, .num, td.num, .code{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums;}
a{color:var(--accent);}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}

/* ---- Layout shell ---- */
#app{min-height:100%; display:flex;}
.sidebar{
  width:250px; flex:0 0 250px; background:var(--surface); border-right:1px solid var(--line);
  padding:0; position:sticky; top:0; height:100vh; overflow-y:auto; z-index:20;
  padding-top:env(safe-area-inset-top,0px);
}
.brand{padding:20px 20px 14px; border-bottom:1px solid var(--line);}
.brand-mark{display:flex; align-items:baseline; gap:8px;}
.brand-mark .glyph{font-family:'Source Serif 4',serif; font-weight:700; font-size:22px; color:var(--accent); letter-spacing:-0.5px;}
.brand-mark .name{font-family:'Source Serif 4',serif; font-weight:600; font-size:18px;}
.brand-sub{font-size:11px; color:var(--ink-faint); margin-top:3px; letter-spacing:.02em;}

.nav-group{padding:14px 12px 4px;}
.nav-group-label{font-size:11px; color:var(--ink-faint); padding:6px 10px 4px; letter-spacing:.03em;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:6px; cursor:pointer;
  color:var(--ink-soft); font-size:13.5px; font-weight:500; margin-bottom:1px; border:1px solid transparent;
  user-select:none;
}
.nav-item:hover{background:var(--surface-2); color:var(--ink);}
.nav-item.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
.nav-item .ic{width:16px; text-align:center; font-size:14px; opacity:.85;}
.nav-item.locked{opacity:.4; cursor:not-allowed;}
.nav-item.locked:hover{background:transparent; color:var(--ink-soft);}

.topbar{
  position:sticky; top:0; z-index:15; background:var(--paper); border-bottom:1px solid var(--line);
  padding:10px 22px; padding-top:calc(10px + env(safe-area-inset-top,0px));
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.selector{
  display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft);
  border:1px solid var(--line); border-radius:6px; padding:5px 9px; background:var(--surface);
}
.selector select{border:none; background:transparent; font-family:inherit; font-size:12.5px; color:var(--ink); outline:none; max-width:170px;}
.spacer{flex:1;}
.role-badge{font-size:11.5px; padding:4px 10px; border-radius:20px; background:var(--accent-soft); color:var(--accent); font-weight:600; letter-spacing:.02em;}
.hamburger{display:none; border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:6px 10px; cursor:pointer;}

.main{flex:1; min-width:0; padding-bottom:60px;}
.content{padding:26px 30px; max-width:1320px;}
.page-head{margin-bottom:20px;}
.page-head h1{font-size:23px; margin:0 0 4px; font-weight:600;}
.page-head p{margin:0; color:var(--ink-soft); font-size:13px; max-width:640px;}
.crumb{font-size:11.5px; color:var(--ink-faint); margin-bottom:6px; letter-spacing:.02em;}

/* ---- ledger strip (KPI) ---- */
.ledger-strip{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface); margin-bottom:22px; flex-wrap:wrap;}
.ledger-cell{flex:1; min-width:150px; padding:14px 18px; border-right:1px solid var(--line);}
.ledger-cell:last-child{border-right:none;}
.ledger-cell .l{font-size:11px; color:var(--ink-faint); margin-bottom:6px;}
.ledger-cell .v{font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:600; font-variant-numeric:tabular-nums;}
.ledger-cell .v.pos{color:var(--debit);}
.ledger-cell .v.neg{color:var(--danger);}

/* ---- panels / sections ---- */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:8px; margin-bottom:22px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; padding:13px 18px; border-bottom:1px solid var(--line); gap:10px; flex-wrap:wrap;}
.panel-head h2{font-size:15.5px; margin:0; font-weight:600;}
.panel-head .hint{font-size:12px; color:var(--ink-faint);}
.panel-body{padding:16px 18px;}
.two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:20px;}
@media (max-width:980px){.two-col{grid-template-columns:1fr;}}

/* ---- tables ---- */
.table-wrap{overflow-x:auto; border-radius:6px;}
table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  text-align:left; font-size:10.5px; color:var(--ink-faint); font-weight:600; letter-spacing:.04em;
  padding:8px 12px; border-bottom:1px solid var(--line-strong); white-space:nowrap;
}
tbody td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
td.wrap, th.wrap{white-space:normal;}
.num{text-align:right; font-variant-numeric:tabular-nums;}
.t-right{text-align:right;}

/* ---- badges / pills ---- */
.pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600; letter-spacing:.01em;}
.pill.posted{background:var(--accent-soft); color:var(--accent);}
.pill.draft{background:var(--warn-soft); color:var(--warn);}
.pill.annulled{background:var(--danger-soft); color:var(--danger);}
.pill.paid{background:var(--accent-soft); color:var(--accent);}
.pill.partial{background:var(--warn-soft); color:var(--warn);}
.pill.open{background:var(--surface-2); color:var(--ink-soft);}
.pill.closed{background:var(--danger-soft); color:var(--danger);}

/* ---- forms ---- */
label{display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:4px; font-weight:500;}
input[type=text], input[type=number], input[type=date], input[type=email], select, textarea{
  width:100%; padding:8px 10px; border:1px solid var(--line-strong); border-radius:6px; background:var(--surface);
  color:var(--ink); font-family:inherit; font-size:13px; outline:none;
}
input:focus, select:focus, textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
.field{margin-bottom:12px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
.grid4{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px;}
@media (max-width:700px){.grid2,.grid3,.grid4{grid-template-columns:1fr;}}

button.btn{
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); padding:8px 14px;
  border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
}
button.btn:hover{background:var(--surface-2);}
button.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
button.btn.primary:hover{filter:brightness(1.08);}
button.btn.danger{background:var(--surface); border-color:var(--danger); color:var(--danger);}
button.btn.ghost{border-color:transparent; background:transparent;}
button.btn.sm{padding:5px 10px; font-size:12px;}
button.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

.empty{padding:34px 20px; text-align:center; color:var(--ink-faint); font-size:13px;}
.empty .big{font-size:26px; margin-bottom:8px; opacity:.5;}

.tag-line{border-left:3px solid var(--line-strong); padding-left:10px; margin:10px 0; font-size:12.5px; color:var(--ink-soft);}
.notice{padding:11px 14px; border-radius:6px; font-size:12.5px; margin-bottom:14px; border:1px solid;}
.notice.info{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
.notice.warn{background:var(--warn-soft); border-color:var(--warn); color:var(--warn);}
.notice.danger{background:var(--danger-soft); border-color:var(--danger); color:var(--danger);}

/* toast */
#toastHost{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); right:18px; z-index:100; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:7px; font-size:12.5px; box-shadow:0 6px 18px rgba(0,0,0,.18); max-width:320px;}
:root[data-theme="dark"] .toast{background:var(--surface-2); color:var(--ink); border:1px solid var(--line-strong);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:var(--surface-2); color:var(--ink); border:1px solid var(--line-strong);}}

/* modal */
.modal-back{position:fixed; inset:0; background:rgba(15,20,16,.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:60; overflow-y:auto;}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:10px; width:100%; max-width:620px; box-shadow:0 20px 50px rgba(0,0,0,.2);}
.modal.wide{max-width:840px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line);}
.modal-head h3{margin:0; font-size:16px; font-weight:600;}
.modal-body{padding:18px 20px; max-height:70vh; overflow-y:auto;}
.modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:14px 20px; border-top:1px solid var(--line);}
.close-x{cursor:pointer; color:var(--ink-faint); font-size:18px; border:none; background:none; line-height:1;}

.entry-lines-table input, .entry-lines-table select{padding:6px 8px; font-size:12.5px;}
.total-bar{display:flex; gap:22px; padding:10px 4px 0; font-size:12.5px; border-top:1px dashed var(--line-strong); margin-top:8px;}
.total-bar b{font-family:'IBM Plex Mono',monospace;}
.balance-ok{color:var(--debit); font-weight:600;}
.balance-bad{color:var(--danger); font-weight:600;}

.kpi-mini{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
.kpi-mini:last-child{border-bottom:none;}
.kpi-mini .dot{width:8px; height:8px; border-radius:50%; flex:0 0 8px;}
.kpi-mini .lab{flex:1; font-size:12.5px; color:var(--ink-soft);}
.kpi-mini .val{font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600;}

.chat-box{border:1px solid var(--line); border-radius:8px; overflow:hidden;}
.chat-log{max-height:320px; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px;}
.msg{max-width:82%; padding:9px 12px; border-radius:9px; font-size:13px; line-height:1.45;}
.msg.user{align-self:flex-end; background:var(--accent); color:var(--accent-ink);}
.msg.bot{align-self:flex-start; background:var(--surface-2); color:var(--ink);}
.chat-input{display:flex; border-top:1px solid var(--line);}
.chat-input input{border:none; border-radius:0; flex:1; padding:12px 14px;}
.chat-input button{border:none; background:var(--accent); color:var(--accent-ink); padding:0 18px; font-weight:600; cursor:pointer;}
.suggest-row{display:flex; gap:6px; flex-wrap:wrap; padding:0 16px 12px;}
.suggest-chip{font-size:11.5px; padding:4px 10px; border:1px solid var(--line-strong); border-radius:20px; cursor:pointer; color:var(--ink-soft); background:var(--surface);}
.suggest-chip:hover{background:var(--surface-2);}

.acct-tree-row{display:flex; gap:10px; padding:7px 12px; border-bottom:1px solid var(--line); font-size:12.5px; align-items:center;}
.acct-tree-row .code{width:76px; flex:0 0 76px; color:var(--ink-faint);}
.acct-tree-row .nm{flex:1;}
.acct-tree-row.lvl1{font-weight:700; background:var(--surface-2);}
.acct-tree-row.lvl2{font-weight:600; padding-left:24px;}
.acct-tree-row.lvl3{padding-left:40px; color:var(--ink-soft);}

footer.appfoot{padding:20px 30px 40px; color:var(--ink-faint); font-size:11.5px; max-width:1320px;}

/* ---- login screen ---- */
.login-wrap{
  min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center;
  background:var(--paper); padding:24px; padding-top:calc(24px + env(safe-area-inset-top,0px));
  padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
}
.login-card{
  width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:32px 30px; box-shadow:0 12px 40px rgba(22,33,27,.08);
}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:38px;}
.pw-eye{
  position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none; border:none;
  cursor:pointer; font-size:15px; line-height:1; color:var(--ink-faint); padding:6px; border-radius:5px;
}
.pw-eye:hover{color:var(--ink); background:var(--surface-2);}

@media (max-width:880px){
  .sidebar{position:fixed; left:0; top:0; transform:translateX(-100%); transition:transform .18s ease; box-shadow:0 0 0 rgba(0,0,0,0);}
  .sidebar.open{transform:translateX(0); box-shadow:20px 0 40px rgba(0,0,0,.25);}
  .hamburger{display:inline-block;}
  .content{padding:18px 16px;}
  .topbar{padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top,0px));}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toastHost"></div>
<script>
/* =========================================================================
   CONTAFI ERP — NÚCLEO CONTABLE
   Motor de partida doble, PUC, terceros, inventarios, tesorería, reportes.
   ========================================================================= */

/* ---------------------------- Utilidades ------------------------------- */
function uid(p){ return (p||'id')+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function isoDaysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function fmtMoney(n){ n = Math.round(Number(n)||0); return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n); }
function fmtNum(n){ return new Intl.NumberFormat('es-CO',{maximumFractionDigits:0}).format(Math.round(Number(n)||0)); }
function fmtDate(s){ if(!s) return '—'; const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(s){ const d=new Date(s); return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Hash simple y determinístico (no criptográfico) para el bloqueo de roles en el navegador.
   No sustituye autenticación real de servidor — ver nota en Configuración > Seguridad. */
function simpleHash(str){
  str = String(str);
  let h1 = 0xdeadbeef ^ 0, h2 = 0x41c6ce57 ^ 0;
  for(let i=0;i<str.length;i++){
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (4294967296*(2097151 & h2) + (h1>>>0)).toString(36);
}
function roleHasPassword(role){ return !!(DB.roleAuth[role] && DB.roleAuth[role].hash); }
/* Campo de contraseña con botón de "ojito" para mostrar/ocultar el texto mientras se escribe. */
function pwFieldHtml(id, label, placeholder, opts){
  opts = opts||{};
  return `<div class="field"><label>${esc(label)}</label>
    <div class="pw-wrap">
      <input type="password" id="${id}" autocomplete="off" placeholder="${esc(placeholder||'')}" ${opts.onEnter?`onkeydown="if(event.key==='Enter'){${opts.onEnter}}"`:''}>
      <button type="button" class="pw-eye" tabindex="-1" title="Mostrar u ocultar contraseña" onclick="App.togglePwVisibility('${id}', this)">👁</button>
    </div>
  </div>`;
}
function migrateRoleAuth(){
  if(!DB.roleAuth) DB.roleAuth = {};
  Object.keys(DB.roleAuth).forEach(r=>{
    const v = DB.roleAuth[r];
    if(typeof v === 'string'){ DB.roleAuth[r] = {hash:v, plain:null}; } // contraseñas creadas antes de esta versión: no se guardó el texto plano
  });
}
function monthLabel(ym){ const [y,m]=ym.split('-'); const names=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']; return names[parseInt(m,10)-1]+' '+y; }
function toast(msg, kind){
  const host=document.getElementById('toastHost');
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  if(kind==='danger'){ el.style.borderLeft='3px solid var(--danger)'; }
  if(kind==='ok'){ el.style.borderLeft='3px solid var(--accent)'; }
  host.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),320); }, 3200);
}

/* ---------------------------- RBAC -------------------------------------- */
const ROLES = ['SuperAdmin','Contador','AuxContable','Tesorero','Gerente','Auditor'];
const ROLE_LABELS = {SuperAdmin:'Super Administrador', Contador:'Contador', AuxContable:'Auxiliar Contable', Tesorero:'Tesorero', Gerente:'Gerente', Auditor:'Auditor'};
const ROLE_USER = {SuperAdmin:'A. Salcedo', Contador:'C. Núñez Vargas', AuxContable:'D. Peña Ríos', Tesorero:'M. Buitrago', Gerente:'S. Camacho', Auditor:'F. Osorio'};
const LEVELS = {NONE:0, READ:1, CREATE:2, APPROVE:3, FULL:4};
const PERMS = {
  SuperAdmin:  {contabilidad:'FULL', ventas:'FULL', compras:'FULL', tesoreria:'FULL', inventario:'FULL', nomina:'FULL', cierres:'FULL', auditoria:'FULL', configuracion:'FULL'},
  Contador:    {contabilidad:'FULL', ventas:'READ', compras:'READ', tesoreria:'APPROVE', inventario:'READ', nomina:'APPROVE', cierres:'FULL', auditoria:'READ', configuracion:'READ'},
  AuxContable: {contabilidad:'CREATE', ventas:'CREATE', compras:'CREATE', tesoreria:'READ', inventario:'CREATE', nomina:'NONE', cierres:'NONE', auditoria:'NONE', configuracion:'NONE'},
  Tesorero:    {contabilidad:'READ', ventas:'READ', compras:'READ', tesoreria:'FULL', inventario:'READ', nomina:'READ', cierres:'NONE', auditoria:'NONE', configuracion:'NONE'},
  Gerente:     {contabilidad:'READ', ventas:'READ', compras:'READ', tesoreria:'READ', inventario:'READ', nomina:'READ', cierres:'NONE', auditoria:'READ', configuracion:'NONE'},
  Auditor:     {contabilidad:'READ', ventas:'READ', compras:'READ', tesoreria:'READ', inventario:'READ', nomina:'READ', cierres:'NONE', auditoria:'FULL', configuracion:'NONE'},
};
function permLevel(role, mod){ const p=(PERMS[role]||{})[mod]||'NONE'; return LEVELS[p]; }

/* ---------------------------- Motor de partida doble ---------------------- */
function postEntry(opts){
  const {companyId, branchId, voucherType, date, concept, lines, role, sourceType, sourceId} = opts;
  let td=0, tc=0;
  lines.forEach(l=>{ td += Math.round(l.debit||0); tc += Math.round(l.credit||0); });
  if(td !== tc){
    throw new Error('El comprobante no está balanceado: Débitos '+fmtMoney(td)+' ≠ Créditos '+fmtMoney(tc)+'. ΣDébitos debe ser igual a ΣCréditos.');
  }
  if(td===0){ throw new Error('El comprobante no tiene movimientos.'); }
  const ym = ymOf(date);
  if(isPeriodClosed(companyId, ym)){
    throw new Error('El período contable '+monthLabel(ym)+' está cerrado. No se pueden registrar nuevos comprobantes en esa fecha.');
  }
  const canFull = can(role,'contabilidad','APPROVE');
  const status = canFull ? 'POSTED' : 'DRAFT';
  const entry = {
    id: uid('ent'), companyId, branchId, voucherType,
    number: nextNumber(companyId, voucherType),
    date, concept, status, sourceType:sourceType||'MANUAL', sourceId:sourceId||null,
    createdBy: role, createdAt: new Date().toISOString(),
    lines: lines.map(l=>({...l, debit:Math.round(l.debit||0), credit:Math.round(l.credit||0)})),
  };
  DB.entries.push(entry);
  addAudit(companyId, 'Contabilidad', (status==='POSTED'?'Contabilizó':'Guardó borrador de')+' comprobante '+entry.number+' — '+concept, role);
  save();
  return entry;
}
function approveEntry(entryId, role){
  if(!can(role,'contabilidad','APPROVE')) throw new Error('Tu rol no tiene permiso para aprobar comprobantes.');
  const e = DB.entries.find(x=>x.id===entryId);
  if(!e) return;
  if(e.status!=='DRAFT') throw new Error('Solo los comprobantes en borrador pueden aprobarse.');
  const ym = ymOf(e.date);
  if(isPeriodClosed(e.companyId, ym)) throw new Error('El período '+monthLabel(ym)+' está cerrado.');
  e.status='POSTED'; e.approvedBy=role; e.approvedAt=new Date().toISOString();
  addAudit(e.companyId,'Contabilidad','Aprobó y contabilizó comprobante '+e.number, role);
  save();
}
function annulEntry(entryId, role, reason){
  if(!can(role,'contabilidad','APPROVE')) throw new Error('Tu rol no tiene permiso para anular comprobantes.');
  const e = DB.entries.find(x=>x.id===entryId);
  if(!e) return;
  if(e.status==='ANNULLED') return;
  e.status='ANNULLED'; e.annulledBy=role; e.annulledAt=new Date().toISOString(); e.annulReason=reason||'';
  addAudit(e.companyId,'Contabilidad','Anuló comprobante '+e.number+(reason?' — Motivo: '+reason:''), role);
  save();
}

/* ---------------------------- Consultas contables -------------------------- */
function accountMovements(companyId, code, opts){
  opts = opts||{};
  const rows=[];
  DB.entries.filter(e=>e.companyId===companyId && e.status==='POSTED' && (!opts.branchId || opts.branchId==='ALL' || e.branchId===opts.branchId))
    .forEach(e=>{
      e.lines.forEach(l=>{
        if(l.accountCode===code && (l.debit||l.credit)){
          rows.push({entry:e, line:l});
        }
      });
    });
  rows.sort((a,b)=> a.entry.date.localeCompare(b.entry.date) || a.entry.number.localeCompare(b.entry.number));
  return rows;
}
function accountBalance(companyId, code, branchId){
  const rows = accountMovements(companyId, code, {branchId});
  let d=0,c=0; rows.forEach(r=>{ d+=r.line.debit; c+=r.line.credit; });
  return {debit:d, credit:c, balance:d-c};
}
function trialBalance(companyId, branchId){
  return leafAccounts(companyId).map(a=>{
    const b = accountBalance(companyId, a.code, branchId);
    return {account:a, ...b};
  }).filter(r=>r.debit!==0 || r.credit!==0);
}
function sumClass(companyId, prefix, branchId){
  let d=0,c=0;
  leafAccounts(companyId).filter(a=>a.code.startsWith(prefix)).forEach(a=>{
    const b=accountBalance(companyId,a.code,branchId); d+=b.debit; c+=b.credit;
  });
  return {debit:d, credit:c};
}
function incomeStatement(companyId, branchId){
  const ing = sumClass(companyId,'4',branchId);     // ingresos: naturaleza crédito
  const cos = sumClass(companyId,'6',branchId);     // costo de ventas: naturaleza débito
  const gas = sumClass(companyId,'5',branchId);     // gastos: naturaleza débito
  const ingresos = ing.credit - ing.debit;
  const costos = cos.debit - cos.credit;
  const gastos = gas.debit - gas.credit;
  const utilidadBruta = ingresos - costos;
  const utilidadNeta = utilidadBruta - gastos;
  return {ingresos, costos, gastos, utilidadBruta, utilidadNeta};
}
function balanceSheet(companyId, branchId){
  const act = sumClass(companyId,'1',branchId);
  const pas = sumClass(companyId,'2',branchId);
  const pat = sumClass(companyId,'3',branchId);
  const activo = act.debit - act.credit;
  const pasivo = pas.credit - pas.debit;
  const patrimonioBase = pat.credit - pat.debit;
  const {utilidadNeta} = incomeStatement(companyId, branchId);
  const patrimonio = patrimonioBase + utilidadNeta;
  return {activo, pasivo, patrimonio, utilidadNeta, cuadra: Math.abs(activo-(pasivo+patrimonio))<1};
}
function bankBalance(bankAccountId){
  let bal=0;
  DB.entries.filter(e=>e.status==='POSTED').forEach(e=>{
    e.lines.forEach(l=>{ if(l.bankAccountId===bankAccountId){ bal += (l.debit-l.credit); } });
  });
  return bal;
}
function totalCash(companyId){
  return bankAccountsOf(companyId).reduce((s,b)=>s+bankBalance(b.id),0) + accountBalance(companyId,'1105').balance;
}
function invoiceBalance(inv){ return Math.max(0, inv.total - inv.paidAmount); }
function billBalance(bill){ return Math.max(0, bill.total - bill.paidAmount); }
function invoiceStatus(inv){ if(inv.paidAmount<=0) return 'open'; if(inv.paidAmount>=inv.total) return 'paid'; return 'partial'; }

/* ---------------------------- Ventas --------------------------------------- */
function createSalesInvoice(o){
  const {companyId, branchId, thirdPartyId, date, items, taxRate, role} = o;
  if(!can(role,'ventas','CREATE')) throw new Error('Tu rol no tiene permiso para crear facturas de venta.');
  if(!thirdPartyId) throw new Error('Selecciona un cliente.');
  if(!items || !items.length) throw new Error('Agrega al menos un producto o servicio a la factura.');
  let subtotal=0, cost=0;
  const detailed = items.map(it=>{
    const p = product(it.productId);
    if(!p) throw new Error('Producto no encontrado.');
    if(p.type==='PRODUCT' && p.stock < it.qty){
      throw new Error('Stock insuficiente de "'+p.name+'": disponible '+fmtNum(p.stock)+' '+p.unit+', solicitado '+fmtNum(it.qty)+'.');
    }
    const lineTotal = it.qty*it.unitPrice;
    subtotal += lineTotal;
    if(p.type==='PRODUCT') cost += it.qty*p.avgCost;
    return {...it, product:p, lineTotal};
  });
  subtotal = Math.round(subtotal); cost=Math.round(cost);
  const taxAmount = Math.round(subtotal*taxRate);
  const total = subtotal+taxAmount;
  const tp = thirdParty(thirdPartyId);
  const lines = [
    {accountCode:'1305', thirdPartyId, debit: total, credit:0, note:'Cartera cliente'},
    {accountCode:'240805', debit:0, credit: taxAmount, note:'IVA generado 19%'},
    {accountCode:'4135', debit:0, credit: subtotal, note:'Ingreso operacional'},
  ];
  if(cost>0){
    lines.push({accountCode:'6135', debit:cost, credit:0, note:'Costo de ventas'});
    lines.push({accountCode:'1435', debit:0, credit:cost, note:'Salida de inventario'});
  }
  const entry = postEntry({companyId, branchId, voucherType:'FV', date, concept:'Factura de venta a '+tp.name, lines, role, sourceType:'SALE'});
  const invoice = {
    id: uid('inv'), companyId, branchId, thirdPartyId, number:entry.number, date,
    items: detailed.map(d=>({productId:d.productId, name:d.product.name, qty:d.qty, unitPrice:d.unitPrice, total:d.lineTotal})),
    subtotal, taxAmount, total, paidAmount:0, entryId:entry.id,
  };
  DB.invoices.push(invoice);
  detailed.forEach(d=>{
    if(d.product.type==='PRODUCT'){
      const before = d.product.stock;
      d.product.stock -= d.qty;
      DB.inventoryMovements.push({id:uid('mv'), companyId, productId:d.productId, type:'OUT', qty:d.qty, unitCost:d.product.avgCost,
        totalValue: Math.round(d.qty*d.product.avgCost), stockBefore:before, stockAfter:d.product.stock, date, ref:invoice.number, entryId:entry.id});
    }
  });
  addAudit(companyId,'Ventas','Emitió factura de venta '+invoice.number+' a '+tp.name+' por '+fmtMoney(total), role);
  save();
  return invoice;
}

function createPurchaseBill(o){
  const {companyId, branchId, thirdPartyId, date, items, taxRate, role} = o;
  if(!can(role,'compras','CREATE')) throw new Error('Tu rol no tiene permiso para registrar facturas de compra.');
  if(!thirdPartyId) throw new Error('Selecciona un proveedor.');
  if(!items || !items.length) throw new Error('Agrega al menos un producto o servicio a la factura.');
  let subtotal=0;
  const detailed = items.map(it=>{
    const p = product(it.productId);
    if(!p) throw new Error('Producto no encontrado.');
    const lineTotal = it.qty*it.unitCost;
    subtotal += lineTotal;
    return {...it, product:p, lineTotal};
  });
  subtotal = Math.round(subtotal);
  const taxAmount = Math.round(subtotal*taxRate);
  const total = subtotal+taxAmount;
  const tp = thirdParty(thirdPartyId);
  const invAccount = detailed.some(d=>d.product.type==='PRODUCT') ? '1435' : '5195';
  const lines = [
    {accountCode:invAccount, debit: subtotal, credit:0, note:'Entrada de inventario / gasto'},
    {accountCode:'135515', debit: taxAmount, credit:0, note:'IVA descontable'},
    {accountCode:'2205', thirdPartyId, debit:0, credit: total, note:'Cuenta por pagar proveedor'},
  ];
  const entry = postEntry({companyId, branchId, voucherType:'FC', date, concept:'Factura de compra de '+tp.name, lines, role, sourceType:'PURCHASE'});
  const bill = {
    id: uid('bill'), companyId, branchId, thirdPartyId, number:entry.number, date,
    items: detailed.map(d=>({productId:d.productId, name:d.product.name, qty:d.qty, unitCost:d.unitCost, total:d.lineTotal})),
    subtotal, taxAmount, total, paidAmount:0, entryId:entry.id,
  };
  DB.bills.push(bill);
  detailed.forEach(d=>{
    if(d.product.type==='PRODUCT'){
      const p=d.product; const before=p.stock;
      const newQty = p.stock + d.qty;
      const newCost = newQty>0 ? Math.round(((p.stock*p.avgCost)+(d.qty*d.unitCost))/newQty) : d.unitCost;
      p.stock = newQty; p.avgCost = newCost;
      DB.inventoryMovements.push({id:uid('mv'), companyId, productId:d.productId, type:'IN', qty:d.qty, unitCost:d.unitCost,
        totalValue: Math.round(d.qty*d.unitCost), stockBefore:before, stockAfter:p.stock, date, ref:bill.number, entryId:entry.id});
    }
  });
  addAudit(companyId,'Compras','Registró factura de compra '+bill.number+' de '+tp.name+' por '+fmtMoney(total), role);
  save();
  return bill;
}

  bill.paidAmount += amount;

function registerCashMovement(o){

  if(!can(role,'tesoreria','CREATE')) throw new Error('Tu rol no tiene permiso para registrar movimientos de tesorería.');
  if(amount<=0) throw new Error('El valor debe ser mayor a cero.');
  const lines = direction==='IN'
    ? [{accountCode:'1110', bankAccountId, debit:amount, credit:0},{accountCode:counterCode, debit:0, credit:amount}]
    : [{accountCode:counterCode, debit:amount, credit:0},{accountCode:'1110', bankAccountId, debit:0, credit:amount}];
  const entry = postEntry({companyId, branchId, voucherType: direction==='IN'?'CI':'CE', date, concept, lines, role, sourceType:'CASH_MOVEMENT'});
  addAudit(companyId,'Tesorería',(direction==='IN'?'Registró ingreso':'Registró egreso')+' de '+fmtMoney(amount)+' — '+concept, role);
  save();
  return entry;
}

App.submitRolePassword = function(role){
  const input = document.getElementById('fRolePass');
  const pass = input ? input.value : '';
  if(simpleHash(pass) === DB.roleAuth[role].hash){
    UI.unlockedRoles.add(role);
    addAudit(UI.companyId, 'Seguridad', 'Acceso concedido al rol '+ROLE_LABELS[role]+' (contraseña correcta)', role);
    save();

  }else{
    addAudit(UI.companyId, 'Seguridad', 'Intento fallido de acceso al rol '+ROLE_LABELS[role], UI.role);
    save();
    const err = document.getElementById('rolePassError');
    if(err){ err.style.display='block'; err.textContent='Contraseña incorrecta. Inténtalo de nuevo.'; }
    if(input){ input.value=''; input.focus(); }
    toast('Contraseña incorrecta para el rol '+ROLE_LABELS[role]+'.','danger');

};

function pill(status){
  const map = {POSTED:['posted','Contabilizado'], DRAFT:['draft','Borrador'], ANNULLED:['annulled','Anulado'],
    paid:['paid','Pagada'], partial:['partial','Parcial'], open:['open','Pendiente'],
    OPEN:['open','Abierto'], CLOSED:['closed','Cerrado']};
  const m = map[status] || ['open', status];
  return `<span class="pill ${m[0]}">${m[1]}</span>`;
}
function emptyRow(colspan, text){ return `<tr><td colspan="${colspan}"><div class="empty">${esc(text)}</div></td></tr>`; }

}

function refreshCharts(){
  if(UI.route!=='dashboard') return;
  const cid = UI.companyId;
  const months = [];
  for(let i=5;i>=0;i--){ const d=new Date(); d.setMonth(d.getMonth()-i); months.push(d.toISOString().slice(0,7)); }
  const rev = months.map(ym=>{
    let ingresos=0, costosGastos=0;
    DB.entries.filter(e=>e.companyId===cid && e.status==='POSTED' && e.date.slice(0,7)===ym && (UI.branchId==='ALL'||e.branchId===UI.branchId))
      .forEach(e=>e.lines.forEach(l=>{
        if(l.accountCode.startsWith('4')) ingresos += (l.credit-l.debit);
        if(l.accountCode.startsWith('5')||l.accountCode.startsWith('6')) costosGastos += (l.debit-l.credit);
      }));
    return {ym, ingresos, costosGastos};
  });
  const styles = getComputedStyle(document.documentElement);
  const inkSoft = styles.getPropertyValue('--ink-soft').trim();
  const line = styles.getPropertyValue('--line').trim();
  const accent = styles.getPropertyValue('--accent').trim();
  const credit = styles.getPropertyValue('--credit').trim();

  const c1 = document.getElementById('chartRevenue');
  if(c1 && window.Chart){
    if(UI.chartRef) UI.chartRef.destroy();
    UI.chartRef = new Chart(c1, {
      type:'line',
      data:{ labels:rev.map(r=>monthLabel(r.ym)), datasets:[
        {label:'Ingresos', data:rev.map(r=>r.ingresos), borderColor:accent, backgroundColor:accent+'33', tension:.3, fill:true},
        {label:'Costo + Gastos', data:rev.map(r=>r.costosGastos), borderColor:credit, backgroundColor:credit+'22', tension:.3, fill:true},
      ]},
      options:{ plugins:{legend:{labels:{color:inkSoft, font:{family:"IBM Plex Sans", size:11}}}},
        scales:{ x:{ticks:{color:inkSoft, font:{size:10}}, grid:{color:line}}, y:{ticks:{color:inkSoft, font:{size:10}}, grid:{color:line}} } }
    });
  }
  const expenseAccounts = leafAccounts(cid).filter(a=>a.code.startsWith('5')||a.code.startsWith('6'));
  const expData = expenseAccounts.map(a=>({name:a.name, val:accountBalance(cid,a.code,UI.branchId).balance})).filter(x=>x.val>0).sort((a,b)=>b.val-a.val).slice(0,6);
  const c2 = document.getElementById('chartExpense');
  if(c2 && window.Chart){
    if(UI.chartRef2) UI.chartRef2.destroy();
    const palette = [accent, credit, '#8A6DAA', '#4E80B5', '#B5834E', '#7C877F'];
    UI.chartRef2 = new Chart(c2, {
      type:'doughnut',
      data:{ labels:expData.map(x=>x.name), datasets:[{data:expData.map(x=>x.val), backgroundColor:palette, borderColor:styles.getPropertyValue('--surface').trim(), borderWidth:2}] },
      options:{ plugins:{legend:{position:'bottom', labels:{color:inkSoft, font:{family:"IBM Plex Sans", size:10.5}, boxWidth:10}}} }
    });
  }
}

App.saveAccount = function(){

App.onInvoiceItemChange = function(sel){
  const row = sel.closest('tr');
  const opt = sel.selectedOptions[0];
  if(opt && opt.value){ row.querySelector('td:nth-child(3) input').value = opt.dataset.price; }
  App.recalcInvoice();
};
App.recalcInvoice = function(){
  const rows = modalBody().querySelectorAll('#invItemsBody tr');
  let subtotal=0;
  rows.forEach(r=>{
    const qty = Number(r.querySelector('td:nth-child(2) input').value)||0;
    const price = Number(r.querySelector('td:nth-child(3) input').value)||0;
    const t = qty*price; subtotal += t;
    r.querySelector('.line-total').textContent = fmtMoney(t);
  });
  const tax = Math.round(subtotal*0.19); const total = subtotal+tax;
  modalBody().querySelector('#invSubtotal').textContent = fmtMoney(subtotal);
  modalBody().querySelector('#invTax').textContent = fmtMoney(tax);
  modalBody().querySelector('#invTotal').textContent = fmtMoney(total);
};
App.submitInvoice = function(){
  const b = modalBody();
  const rows = b.querySelectorAll('#invItemsBody tr');
  const items = [];
  rows.forEach(r=>{
    const sel = r.querySelector('select');
    if(sel.value){ items.push({productId:sel.value, qty:Number(r.querySelector('td:nth-child(2) input').value)||0, unitPrice:Number(r.querySelector('td:nth-child(3) input').value)||0}); }
  });
  try{
    createSalesInvoice({companyId:UI.companyId, branchId:b.querySelector('#fInvBranch').value, thirdPartyId:b.querySelector('#fInvClient').value,
      date:b.querySelector('#fInvDate').value, items, taxRate:0.19, role:UI.role});
    App.closeModal(); rerender(); toast('Factura de venta emitida y contabilizada correctamente.','ok');
  }catch(err){ toast(err.message,'danger'); }
};

App.onBillItemChange = function(sel){
  const row = sel.closest('tr'); const opt = sel.selectedOptions[0];
  if(opt && opt.value){ row.querySelector('td:nth-child(3) input').value = opt.dataset.cost; }
  App.recalcBill();
};
App.recalcBill = function(){
  const rows = modalBody().querySelectorAll('#billItemsBody tr');
  let subtotal=0;
  rows.forEach(r=>{
    const qty = Number(r.querySelector('td:nth-child(2) input').value)||0;
    const cost = Number(r.querySelector('td:nth-child(3) input').value)||0;
    const t = qty*cost; subtotal+=t;
    r.querySelector('.line-total').textContent = fmtMoney(t);
  });
  const tax = Math.round(subtotal*0.19); const total = subtotal+tax;
  modalBody().querySelector('#billSubtotal').textContent = fmtMoney(subtotal);
  modalBody().querySelector('#billTax').textContent = fmtMoney(tax);
  modalBody().querySelector('#billTotal').textContent = fmtMoney(total);
};

  const b = modalBody();

    if(sel.value){ items.push({productId:sel.value, qty:Number(r.querySelector('td:nth-child(2) input').value)||0, unitCost:Number(r.querySelector('td:nth-child(3) input').value)||0}); }
  });
  try{
    createPurchaseBill({companyId:UI.companyId, branchId:b.querySelector('#fBillBranch').value, thirdPartyId:b.querySelector('#fBillSupplier').value,

};

App.recalcEntry = function(){
  const rows = modalBody().querySelectorAll('#entryLinesBody tr');
  let d=0,c=0;
  rows.forEach(r=>{ d+= Number(r.querySelector('td:nth-child(3) input').value)||0; c+= Number(r.querySelector('td:nth-child(4) input').value)||0; });
  modalBody().querySelector('#enDeb').textContent = fmtMoney(d);
  modalBody().querySelector('#enCred').textContent = fmtMoney(c);
  const msg = modalBody().querySelector('#enBalanceMsg');
  if(d===c && d>0){ msg.textContent='Balanceado ✓'; msg.className='balance-ok'; }
  else{ msg.textContent='Diferencia: '+fmtMoney(Math.abs(d-c)); msg.className='balance-bad'; }
};
App.submitEntry = function(){
  const b = modalBody();
  const rows = b.querySelectorAll('#entryLinesBody tr');
  const lines = [];
  rows.forEach(r=>{
    const code = r.querySelector('select').value;
    const debit = Number(r.querySelector('td:nth-child(3) input').value)||0;
    const credit = Number(r.querySelector('td:nth-child(4) input').value)||0;
    const note = r.querySelector('td:nth-child(2) input').value.trim();
    if(debit>0||credit>0) lines.push({accountCode:code, debit, credit, note});
  });
  const concept = b.querySelector('#fEnConcept').value.trim();
  if(!concept) return toast('Ingresa el concepto del comprobante.','danger');
  try{
    postEntry({companyId:UI.companyId, branchId:b.querySelector('#fEnBranch').value, voucherType:'CG', date:b.querySelector('#fEnDate').value, concept, lines, role:UI.role});
    App.closeModal(); rerender(); toast('Comprobante guardado correctamente.','ok');
  }catch(err){ toast(err.message,'danger'); }
};

App.askAssistant = function(q){
  q = (q||'').trim(); if(!q) return;
  CHAT_LOG.push({who:'user', text:esc(q)});
  CHAT_LOG.push({who:'bot', text:answerFinance(q)});
  if(CHAT_LOG.length>40) CHAT_LOG = CHAT_LOG.slice(-40);
  rerender();
  setTimeout(()=>{ const log=document.getElementById('chatLog'); if(log) log.scrollTop = log.scrollHeight; }, 30);
};
function answerFinance(qRaw){
  const q = qRaw.toLowerCase();
  const cid = UI.companyId;
  const has = (...ws)=> ws.some(w=>q.includes(w));
  if(has('cartera','cxc','cobrar')){
    const total = DB.invoices.filter(i=>i.companyId===cid).reduce((s,i)=>s+invoiceBalance(i),0);
    const n = DB.invoices.filter(i=>i.companyId===cid && invoiceBalance(i)>0).length;
    return 'Tu cartera pendiente por cobrar es de <b>'+fmtMoney(total)+'</b>, distribuida en '+n+' factura(s) sin saldar.';
  }
  if(has('cxp','proveedor','pagar')){
    const total = DB.bills.filter(b=>b.companyId===cid).reduce((s,b)=>s+billBalance(b),0);
    const n = DB.bills.filter(b=>b.companyId===cid && billBalance(b)>0).length;
    return 'Debes a proveedores <b>'+fmtMoney(total)+'</b>, en '+n+' factura(s) de compra pendientes.';
  }
  if(has('banco','bancos')){
    const total = bankAccountsOf(cid).reduce((s,b)=>s+bankBalance(b.id),0);
    return 'El saldo total en cuentas bancarias es de <b>'+fmtMoney(total)+'</b>, distribuido en '+bankAccountsOf(cid).length+' cuenta(s).';
  }
  if(has('caja')){
    return 'El saldo actual de Caja General es de <b>'+fmtMoney(accountBalance(cid,'1105').balance)+'</b>.';
  }
  if(has('utilidad','ganancia','perdid','resultado')){
    const is = incomeStatement(cid, 'ALL');
    return (is.utilidadNeta>=0?'La utilidad':'La pérdida')+' acumulada del ejercicio es de <b>'+fmtMoney(Math.abs(is.utilidadNeta))+'</b> (ingresos '+fmtMoney(is.ingresos)+' − costos '+fmtMoney(is.costos)+' − gastos '+fmtMoney(is.gastos)+').';
  }
  if(has('iva')){
    const gen = accountBalance(cid,'240805').balance;
    const desc = accountBalance(cid,'135515').balance;
    return 'IVA generado en ventas: <b>'+fmtMoney(-gen)+'</b>. IVA descontable en compras: <b>'+fmtMoney(desc)+'</b>. Saldo neto por pagar a la DIAN: <b>'+fmtMoney(-gen-desc)+'</b>.';
  }
  if(has('stock','inventario','existencia')){
    const low = productsOf(cid).filter(p=>p.type==='PRODUCT' && p.stock<=15);
    if(!low.length) return 'Todos los productos tienen niveles de inventario saludables (más de 15 unidades).';
    return 'Productos con inventario bajo: '+low.map(p=>esc(p.name)+' ('+fmtNum(p.stock)+' und.)').join(', ')+'.';
  }
  if(has('activo')){
    return 'El total de activos de la compañía es <b>'+fmtMoney(balanceSheet(cid,'ALL').activo)+'</b>.';
  }
  if(has('pasivo')){
    return 'El total de pasivos de la compañía es <b>'+fmtMoney(balanceSheet(cid,'ALL').pasivo)+'</b>.';
  }
  if(has('patrimonio')){
    return 'El patrimonio actual (incluida la utilidad del ejercicio) es de <b>'+fmtMoney(balanceSheet(cid,'ALL').patrimonio)+'</b>.';
  }
  if(has('ingreso','venta','factur')){
    const is = incomeStatement(cid,'ALL');
    return 'Los ingresos operacionales acumulados suman <b>'+fmtMoney(is.ingresos)+'</b>, provenientes de '+DB.invoices.filter(i=>i.companyId===cid).length+' factura(s) de venta.';
  }
  return 'No tengo una respuesta calculada para esa pregunta todavía. Puedo ayudarte con cartera, cuentas por pagar, bancos, caja, IVA, inventario, activos, pasivos, patrimonio y utilidad. Prueba con una de las sugerencias debajo del chat.';
}

      return `<tr><td class="mono">${esc(b.code)}</td><td class="wrap">${esc(b.name)}</td><td>${esc(b.city)}</td><td class="num mono">${fmtNum(nMov)}</td>
      <td class="btn-row">
        <button class="btn ghost sm" ${canEdit?'':'disabled'} onclick="App.openBranchModal('${b.id}')">Editar</button>
        <button class="btn danger sm" ${canDelete?'':'disabled'} onclick="App.deleteBranch('${b.id}')">Eliminar</button>
      </td></tr>`;
    }).join('') : emptyRow(5,'No hay sucursales registradas.')}
    </tbody></table></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2>Seguridad de Roles</h2><span class="hint">Protege con contraseña quién puede entrar a cada rol</span></div>
    <div class="panel-body">
      <div class="notice warn">Esta protección es un control de acceso del lado del navegador, pensado para evitar que alguien cambie de rol por descuido o sin autorización. No es un sistema de autenticación de servidor. Como privilegio del Super Administrador, las contraseñas se guardan también en texto legible (además de un hash) para poder consultarlas o restablecerlas aquí mismo — ten en cuenta que eso también significa que, técnicamente, no están cifradas de forma irreversible.</div>
    </div>
    <div class="table-wrap"><table><thead><tr><th>Rol</th><th>Estado</th><th>Sesión</th><th></th></tr></thead><tbody>
    ${ROLES.map(r=>{
      const hasPass = roleHasPassword(r);
      const unlocked = UI.unlockedRoles.has(r);
      const canManage = can(UI.role,'configuracion','FULL');
      return `<tr><td style="font-weight:600;">${ROLE_LABELS[r]}</td>
        <td>${hasPass?'<span class="pill closed">Protegido</span>':'<span class="pill open">Sin contraseña</span>'}</td>
        <td>${unlocked?'<span class="pill posted">Desbloqueado</span>':'<span class="pill draft">Bloqueado</span>'}</td>
        <td class="btn-row">
          ${hasPass?`<button class="btn ghost sm" ${canManage?'':'disabled'} onclick="App.revealRolePassword('${r}')">Ver contraseña</button>`:''}
          <button class="btn ghost sm" ${canManage?'':'disabled'} onclick="App.openSetPasswordModal('${r}')">${hasPass?'Cambiar':'Establecer'}</button>
          ${hasPass?`<button class="btn danger sm" ${canManage?'':'disabled'} onclick="App.removeRolePassword('${r}')">Quitar</button>`:''}
        </td></tr>`;
    }).join('')}
    </tbody></table></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2>Matriz de Roles y Permisos (RBAC)</h2><span class="hint">Nivel mínimo requerido por módulo</span></div>
    <div class="table-wrap"><table><thead><tr><th>Rol</th><th>Contabilidad</th><th>Ventas/CxC</th><th>Compras/CxP</th><th>Tesorería</th><th>Nómina</th><th>Cierres</th><th>Auditoría</th></tr></thead><tbody>
    ${ROLES.map(r=>`<tr><td style="font-weight:600;">${ROLE_LABELS[r]}</td>
      <td>${PERMS[r].contabilidad}</td><td>${PERMS[r].ventas}</td><td>${PERMS[r].compras}</td><td>${PERMS[r].tesoreria}</td>
      <td>${PERMS[r].nomina}</td><td>${PERMS[r].cierres}</td><td>${PERMS[r].auditoria}</td></tr>`).join('')}
    </tbody></table></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2>Datos de la aplicación</h2></div>
    <div class="panel-body">
      <p style="color:var(--ink-soft); font-size:12.5px; max-width:600px;">Toda la información de esta demostración se guarda únicamente en el almacenamiento local de tu navegador. Ningún dato se envía a servidores externos.</p>
      <button class="btn danger sm" onclick="if(confirm('¿Reiniciar todos los datos a la demostración inicial? Esta acción no se puede deshacer.')) resetAll();">Reiniciar datos de demostración</button>
    </div>
  </div>`;
};
App.openCompanyModal = function(companyId){
  if(!can(UI.role,'configuracion','CREATE')) return toast('Tu rol no tiene permiso para gestionar compañías.','danger');
  const editing = companyId ? DB.companies.find(c=>c.id===companyId) : null;
  App.openModal(editing?'Editar compañía':'Nueva compañía', `
    <div class="grid2">
      <div class="field"><label>NIT</label><input type="text" id="fCoNit" class="mono" value="${editing?esc(editing.nit):''}" placeholder="900.123.456-7"></div>
      <div class="field"><label>Moneda</label><input type="text" id="fCoCurrency" value="${editing?esc(editing.currency):'COP'}" disabled></div>
    </div>
    <div class="field"><label>Razón social</label><input type="text" id="fCoName" value="${editing?esc(editing.name):''}"></div>
    <div class="grid2">
      <div class="field"><label>Régimen</label><input type="text" id="fCoRegime" value="${editing?esc(editing.regime):'Responsable de IVA — Régimen Ordinario'}"></div>
      <div class="field"><label>Representante legal</label><input type="text" id="fCoLegalRep" value="${editing?esc(editing.legalRep):''}"></div>
    </div>
    <div class="field"><label>Dirección</label><input type="text" id="fCoAddress" value="${editing?esc(editing.address):''}"></div>
    ${editing?'':'<div class="notice info">Se creará automáticamente con una sucursal principal, el Plan Único de Cuentas completo y una cuenta bancaria, lista para operar.</div>'}
  `, `<button class="btn" onclick="App.closeModal()">Cancelar</button><button class="btn primary" onclick="App.saveCompany(${editing?`'${editing.id}'`:'null'})">${editing?'Guardar cambios':'Crear compañía'}</button>`);
};
App.saveCompany = function(companyId){
  if(!can(UI.role,'configuracion','CREATE')) return toast('Tu rol no tiene permiso para gestionar compañías.','danger');
  const b = modalBody();
  const nit = b.querySelector('#fCoNit').value.trim();
  const name = b.querySelector('#fCoName').value.trim();
  const regime = b.querySelector('#fCoRegime').value.trim();
  const legalRep = b.querySelector('#fCoLegalRep').value.trim();
  const address = b.querySelector('#fCoAddress').value.trim();
  if(!nit || !name) return toast('NIT y razón social son obligatorios.','danger');
  const dup = DB.companies.find(x=>x.nit===nit && x.id!==companyId);
  if(dup) return toast('Ya existe una compañía registrada con ese NIT.','danger');
  if(companyId){
    const co = DB.companies.find(x=>x.id===companyId);
    co.nit=nit; co.name=name; co.regime=regime; co.legalRep=legalRep; co.address=address;
    addAudit(UI.companyId,'Configuración','Editó los datos de la compañía '+name, UI.role);
    save(); App.closeModal(); renderTopbarSelectors(); rerender(); toast('Compañía actualizada correctamente.','ok');
  }else{
    const newId = uid('co');
    DB.companies.push({id:newId, nit, name, regime, legalRep, address, currency:'COP'});
    const branchId = uid('br');
    DB.branches.push({id:branchId, companyId:newId, code:'001', name:'Sede Principal', city:''});
    DB.accounts.push(...PUC_SEED.map(([code,acctName,nature,rtp])=>({
      id:uid('acc'), companyId:newId, code, name:acctName, nature,
      level: code.length===1?1:code.length===2?2:code.length===4?3:4,
      requiresThirdParty: rtp, isActive:true
    })));
    DB.bankAccounts.push({id:uid('ba'), companyId:newId, bank:'Banco por definir', name:'Cuenta Principal', number:'—'});
    addAudit(newId,'Configuración','Creó la compañía '+name, UI.role);
    save();
    UI.companyId = newId; UI.branchId='ALL';
    App.closeModal(); renderTopbarSelectors(); renderNav(); rerender();
    toast('Compañía creada. Ahora estás trabajando sobre "'+name+'".','ok');
  }
};
App.deleteCompany = function(companyId){
  if(!can(UI.role,'configuracion','FULL')) return toast('Tu rol no tiene permiso para eliminar compañías.','danger');
  const co = DB.companies.find(x=>x.id===companyId);
  if(!co) return;
  if(DB.companies.length<=1) return toast('No puedes eliminar la única compañía del sistema.','danger');
  const nMov = DB.entries.filter(e=>e.companyId===companyId).length;
  if(nMov>0) return toast('No se puede eliminar "'+co.name+'": tiene '+fmtNum(nMov)+' comprobante(s) contabilizados. Puedes editarla, pero no eliminarla para conservar la trazabilidad.','danger');
  if(!confirm('¿Eliminar la compañía "'+co.name+'" y todos sus datos maestros (sucursales, plan de cuentas, terceros, productos)? Esta acción no se puede deshacer.')) return;
  DB.companies = DB.companies.filter(x=>x.id!==companyId);
  DB.branches = DB.branches.filter(x=>x.companyId!==companyId);
  DB.accounts = DB.accounts.filter(x=>x.companyId!==companyId);
  DB.thirdParties = DB.thirdParties.filter(x=>x.companyId!==companyId);
  DB.products = DB.products.filter(x=>x.companyId!==companyId);
  DB.warehouses = DB.warehouses.filter(x=>x.companyId!==companyId);
  DB.bankAccounts = DB.bankAccounts.filter(x=>x.companyId!==companyId);
  DB.periods = DB.periods.filter(x=>x.companyId!==companyId);
  addAudit(DB.companies[0].id,'Configuración','Eliminó la compañía '+co.name, UI.role);
  if(UI.companyId===companyId){ UI.companyId = DB.companies[0].id; UI.branchId='ALL'; }
  save(); renderTopbarSelectors(); renderNav(); rerender(); toast('Compañía eliminada correctamente.','ok');
};


App.openBranchModal = function(branchId){
  if(!can(UI.role,'configuracion','CREATE')) return toast('Tu rol no tiene permiso para gestionar sucursales.','danger');
  const editing = branchId ? DB.branches.find(b=>b.id===branchId) : null;
  App.openModal(editing?'Editar sucursal':'Nueva sucursal', `
    <div class="grid2">
      <div class="field"><label>Código</label><input type="text" id="fBrCode" class="mono" value="${editing?esc(editing.code):''}"></div>
      <div class="field"><label>Ciudad</label><input type="text" id="fBrCity" value="${editing?esc(editing.city):''}"></div>
    </div>
    <div class="field"><label>Nombre</label><input type="text" id="fBrName" value="${editing?esc(editing.name):''}"></div>
  `, `<button class="btn" onclick="App.closeModal()">Cancelar</button><button class="btn primary" onclick="App.saveBranch(${editing?`'${editing.id}'`:'null'})">${editing?'Guardar cambios':'Guardar sucursal'}</button>`);
};
App.saveBranch = function(branchId){
  if(!can(UI.role,'configuracion','CREATE')) return toast('Tu rol no tiene permiso para gestionar sucursales.','danger');
  const b = modalBody();
  const name = b.querySelector('#fBrName').value.trim();
  const code = b.querySelector('#fBrCode').value.trim();
  const city = b.querySelector('#fBrCity').value.trim();
  if(!name || !code) return toast('Código y nombre son obligatorios.','danger');
  const dup = DB.branches.find(x=>x.companyId===UI.companyId && x.code===code && x.id!==branchId);
  if(dup) return toast('Ya existe una sucursal con ese código.','danger');
  if(branchId){
    const br = DB.branches.find(x=>x.id===branchId);
    br.code=code; br.name=name; br.city=city;
    addAudit(UI.companyId,'Configuración','Editó la sucursal '+name, UI.role);
    toast('Sucursal actualizada correctamente.','ok');
  }else{
    DB.branches.push({id:uid('br'), companyId:UI.companyId, code, name, city});
    addAudit(UI.companyId,'Configuración','Creó la sucursal '+name, UI.role);
    toast('Sucursal creada correctamente.','ok');
  }
  save(); App.closeModal(); renderTopbarSelectors(); rerender();
};
App.deleteBranch = function(branchId){
  if(!can(UI.role,'configuracion','FULL')) return toast('Tu rol no tiene permiso para eliminar sucursales.','danger');
  const br = DB.branches.find(x=>x.id===branchId);
  if(!br) return;
  if(currentBranches().length<=1) return toast('No puedes eliminar la única sucursal de la compañía.','danger');
  const nMov = DB.entries.filter(e=>e.branchId===branchId).length;
  if(nMov>0) return toast('No se puede eliminar "'+br.name+'": tiene '+fmtNum(nMov)+' comprobante(s) asociados. Puedes editarla, pero no eliminarla para conservar la trazabilidad.','danger');
  if(!confirm('¿Eliminar la sucursal "'+br.name+'"? Esta acción no se puede deshacer.')) return;
  DB.branches = DB.branches.filter(x=>x.id!==branchId);
  if(UI.branchId===branchId) UI.branchId='ALL';
  addAudit(UI.companyId,'Configuración','Eliminó la sucursal '+br.name, UI.role);
  save(); renderTopbarSelectors(); rerender(); toast('Sucursal eliminada correctamente.','ok');
};

/* ---------------------------- Gestión de contraseñas por rol ---------------------- */
App.openSetPasswordModal = function(role){
  if(!can(UI.role,'configuracion','FULL')) return toast('Tu rol no tiene permiso para gestionar contraseñas de roles.','danger');
  const hasPass = roleHasPassword(role);
  App.openModal((hasPass?'Cambiar':'Establecer')+' contraseña — '+ROLE_LABELS[role], `
    ${pwFieldHtml('fNewPass1','Nueva contraseña','Mínimo 4 caracteres')}
    ${pwFieldHtml('fNewPass2','Confirmar contraseña','Repite la contraseña')}
    <div class="notice info">Quien seleccione el rol <b>${ROLE_LABELS[role]}</b> en el inicio de sesión o en el selector de la barra superior deberá ingresar esta contraseña para acceder, una vez por sesión de navegador.</div>
  `, `<button class="btn" onclick="App.closeModal()">Cancelar</button><button class="btn primary" onclick="App.saveRolePassword('${role}')">Guardar contraseña</button>`);
};
App.saveRolePassword = function(role){
  if(!can(UI.role,'configuracion','FULL')) return toast('Tu rol no tiene permiso para gestionar contraseñas de roles.','danger');
  const b = modalBody();
  const p1 = b.querySelector('#fNewPass1').value;
  const p2 = b.querySelector('#fNewPass2').value;
  if(p1.length<4) return toast('La contraseña debe tener al menos 4 caracteres.','danger');
  if(p1!==p2) return toast('Las contraseñas no coinciden.','danger');
  DB.roleAuth[role] = {hash: simpleHash(p1), plain: p1};
  UI.unlockedRoles.add(role); // quien la acaba de definir no queda bloqueado de su propia acción
  addAudit(UI.companyId,'Seguridad','Estableció/cambió la contraseña del rol '+ROLE_LABELS[role], UI.role);
  save(); App.closeModal(); rerender(); toast('Contraseña del rol '+ROLE_LABELS[role]+' actualizada.','ok');
};
App.removeRolePassword = function(role){
  if(!can(UI.role,'configuracion','FULL')) return toast('Tu rol no tiene permiso para gestionar contraseñas de roles.','danger');
  if(!confirm('¿Quitar la protección por contraseña del rol '+ROLE_LABELS[role]+'? Cualquiera podrá entrar a ese rol sin contraseña.')) return;
  delete DB.roleAuth[role];
  addAudit(UI.companyId,'Seguridad','Quitó la protección por contraseña del rol '+ROLE_LABELS[role], UI.role);
  save(); rerender(); toast('Protección removida del rol '+ROLE_LABELS[role]+'.','ok');
};
App.revealRolePassword = function(role){
  if(!can(UI.role,'configuracion','FULL')) return toast('Tu rol no tiene permiso para consultar contraseñas de roles.','danger');
  const rec = DB.roleAuth[role];
  addAudit(UI.companyId,'Seguridad','Super Administrador consultó la contraseña del rol '+ROLE_LABELS[role], UI.role);
  save();
  const body = (rec && rec.plain)
    ? `<div class="notice warn">Solo el Super Administrador puede ver esta contraseña. Esta consulta queda registrada en Auditoría.</div>
       <div class="field"><label>Contraseña actual de ${ROLE_LABELS[role]}</label><input type="text" readonly value="${esc(rec.plain)}" class="mono" onclick="this.select()" style="font-size:16px; font-weight:600;"></div>`
    : `<div class="notice danger">Esta contraseña se estableció antes de habilitar la consulta en texto plano, así que no está disponible para ver. Puedes asignar una nueva desde aquí.</div>`;
  App.openModal('Contraseña del rol — '+ROLE_LABELS[role], body,
    rec && rec.plain
      ? `<button class="btn" onclick="App.closeModal()">Cerrar</button><button class="btn primary" onclick="App.closeModal(); App.openSetPasswordModal('${role}');">Cambiarla ahora</button>`
      : `<button class="btn" onclick="App.closeModal()">Cerrar</button><button class="btn primary" onclick="App.closeModal(); App.openSetPasswordModal('${role}');">Asignar nueva contraseña</button>`);
};

/* ============================== LOGIN ================================================ */
function loginPasswordFieldHtml(role){
  if(roleHasPassword(role)){
    return pwFieldHtml('loginPass','Contraseña','Contraseña de '+ROLE_LABELS[role], {onEnter:'App.attemptLogin()'});
  }
  return `<div class="notice info">Este rol no tiene contraseña asignada todavía. Puedes ingresar directamente.</div>`;
}
function renderLogin(){
  const app = document.getElementById('app');
  const c = DB.companies[0];
  app.innerHTML = `
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-mark" style="justify-content:center; margin-bottom:4px;"><span class="glyph">§</span><span class="name">Contafi ERP</span></div>
      <div class="brand-sub" style="text-align:center; margin-bottom:22px;">${esc(c.name)} · Acceso por rol</div>
      <div class="field"><label>Selecciona tu rol</label>
        <select id="loginRoleSelect" onchange="App.onLoginRoleChange(this.value)">
          ${ROLES.map(r=>`<option value="${r}">${ROLE_LABELS[r]}${roleHasPassword(r)?' 🔒':''}</option>`).join('')}
        </select>
      </div>
      <div id="loginPassHost">${loginPasswordFieldHtml(ROLES[0])}</div>
      <div id="loginError" class="notice danger" style="display:none;"></div>
      <button class="btn primary" style="width:100%; padding:10px; margin-top:4px;" onclick="App.attemptLogin()">Ingresar</button>
      <div class="tag-line" style="margin-top:18px;">¿Olvidaste tu contraseña? Solicítala al <b>Super Administrador</b>: puede consultarla o restablecerla desde Configuración → Seguridad de Roles.</div>
    </div>
  </div>`;
  setTimeout(()=>{ const i=document.getElementById('loginPass'); if(i) i.focus(); else document.getElementById('loginRoleSelect').focus(); }, 30);
}
App.onLoginRoleChange = function(role){
  document.getElementById('loginPassHost').innerHTML = loginPasswordFieldHtml(role);
  const err = document.getElementById('loginError'); if(err) err.style.display='none';
  const i = document.getElementById('loginPass'); if(i) i.focus();
};
App.attemptLogin = function(){
  const role = document.getElementById('loginRoleSelect').value;
  const rec = DB.roleAuth[role];
  const passInput = document.getElementById('loginPass');
  const pass = passInput ? passInput.value : '';
  if(rec && rec.hash && simpleHash(pass) !== rec.hash){
    addAudit(UI.companyId,'Seguridad','Intento fallido de inicio de sesión en el rol '+ROLE_LABELS[role], role);
    save();
    const err = document.getElementById('loginError');
    err.style.display='block'; err.textContent='Contraseña incorrecta. Inténtalo de nuevo.';
    if(passInput){ passInput.value=''; passInput.focus(); }
    return;
  }
  UI.role = role;
  UI.unlockedRoles.add(role);
  addAudit(UI.companyId,'Seguridad','Inicio de sesión en el rol '+ROLE_LABELS[role], role);
  save();
  renderShell();
};

/* ============================== INIT ================================================ */
function init(){
  load();
  migrateRoleAuth();
  UI.unlockedRoles = new Set();
  if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){ UI.theme='dark'; document.documentElement.setAttribute('data-theme','dark'); }
  renderLogin();
}
init();
</script>
