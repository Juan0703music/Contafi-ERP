App.saveCompany = function(companyId){
  if(!can(UI.role,'configuracion','CREATE')) return toast('Tu rol no tiene permiso para gestionar compañías.','danger');
  const b = modalBody();
  const nit = b.querySelector('#fCoNit').value.trim();
  const name = b.querySelector('#fCoName').value.trim();
  const regime = b.querySelector('#fCoRegime').value.trim();
  const legalRep = b.querySelector('#fCoLegalRep').value.trim();
  const address = b.querySelector('#fCoAddress').value.trim();
  if(!nit || !name) return toast('NIT y razón social son obligatorios.','danger');
  const dup = DB.companies.find(x=>x.nit===nit && x.id!==companyId);
  if(dup) return toast('Ya existe una compañía registrada con ese NIT.','danger');
  if(companyId){
    const co = DB.companies.find(x=>x.id===companyId);
    co.nit=nit; co.name=name; co.regime=regime; co.legalRep=legalRep; co.address=address;
    addAudit(UI.companyId,'Configuración','Editó los datos de la compañía '+name, UI.role);
    save(); App.closeModal(); renderTopbarSelectors(); rerender(); toast('Compañía actualizada correctamente.','ok');
  }else{
    const newId = uid('co');
    DB.companies.push({id:newId, nit, name, regime, legalRep, address, currency:'COP'});
    const branchId = uid('br');
    DB.branches.push({id:branchId, companyId:newId, code:'001', name:'Sede Principal', city:''});
    DB.accounts.push(...PUC_SEED.map(([code,acctName,nature,rtp])=>({
      id:uid('acc'), companyId:newId, code, name:acctName, nature,
      level: code.length===1?1:code.length===2?2:code.length===4?3:4,
      requiresThirdParty: rtp, isActive:true
    })));
    DB.bankAccounts.push({id:uid('ba'), companyId:newId, bank:'Banco por definir', name:'Cuenta Principal', number:'—'});
    addAudit(newId,'Configuración','Creó la compañía '+name, UI.role);
    save();
    UI.companyId = newId; UI.branchId='ALL';
    App.closeModal(); renderTopbarSelectors(); renderNav(); rerender();
    toast('Compañía creada. Ahora estás trabajando sobre "'+name+'".','ok');
  }
};
App.deleteCompany = function(companyId){
  if(!can(UI.role,'configuracion','FULL')) return toast('Tu rol no tiene permiso para eliminar compañías.','danger');
  const co = DB.companies.find(x=>x.id===companyId);
  if(!co) return;
  if(DB.companies.length<=1) return toast('No puedes eliminar la única compañía del sistema.','danger');
  const nMov = DB.entries.filter(e=>e.companyId===companyId).length;
  if(nMov>0) return toast('No se puede eliminar "'+co.name+'": tiene '+fmtNum(nMov)+' comprobante(s) contabilizados. Puedes editarla, pero no eliminarla para conservar la trazabilidad.','danger');
  if(!confirm('¿Eliminar la compañía "'+co.name+'" y todos sus datos maestros (sucursales, plan de cuentas, terceros, productos)? Esta acción no se puede deshacer.')) return;
  DB.companies = DB.companies.filter(x=>x.id!==companyId);
  DB.branches = DB.branches.filter(x=>x.companyId!==companyId);
  DB.accounts = DB.accounts.filter(x=>x.companyId!==companyId);
  DB.thirdParties = DB.thirdParties.filter(x=>x.companyId!==companyId);
  DB.products = DB.products.filter(x=>x.companyId!==companyId);
  DB.warehouses = DB.warehouses.filter(x=>x.companyId!==companyId);
  DB.bankAccounts = DB.bankAccounts.filter(x=>x.companyId!==companyId);
  DB.periods = DB.periods.filter(x=>x.companyId!==companyId);
  addAudit(DB.companies[0].id,'Configuración','Eliminó la compañía '+co.name, UI.role);
  if(UI.companyId===companyId){ UI.companyId = DB.companies[0].id; UI.branchId='ALL'; }
  save(); renderTopbarSelectors(); renderNav(); rerender(); toast('Compañía eliminada correctamente.','ok');
};


App.openBranchModal = function(branchId){
  if(!can(UI.role,'configuracion','CREATE')) return toast('Tu rol no tiene permiso para gestionar sucursales.','danger');
  const editing = branchId ? DB.branches.find(b=>b.id===branchId) : null;
  App.openModal(editing?'Editar sucursal':'Nueva sucursal', `
    <div class="grid2">
      <div class="field"><label>Código</label><input type="text" id="fBrCode" class="mono" value="${editing?esc(editing.code):''}"></div>
      <div class="field"><label>Ciudad</label><input type="text" id="fBrCity" value="${editing?esc(editing.city):''}"></div>
    </div>
    <div class="field"><label>Nombre</label><input type="text" id="fBrName" value="${editing?esc(editing.name):''}"></div>
  `, `<button class="btn" onclick="App.closeModal()">Cancelar</button><button class="btn primary" onclick="App.saveBranch(${editing?`'${editing.id}'`:'null'})">${editing?'Guardar cambios':'Guardar sucursal'}</button>`);
};
App.saveBranch = function(branchId){
  if(!can(UI.role,'configuracion','CREATE')) return toast('Tu rol no tiene permiso para gestionar sucursales.','danger');
  const b = modalBody();
  const name = b.querySelector('#fBrName').value.trim();
  const code = b.querySelector('#fBrCode').value.trim();
  const city = b.querySelector('#fBrCity').value.trim();
  if(!name || !code) return toast('Código y nombre son obligatorios.','danger');
  const dup = DB.branches.find(x=>x.companyId===UI.companyId && x.code===code && x.id!==branchId);
  if(dup) return toast('Ya existe una sucursal con ese código.','danger');
  if(branchId){
    const br = DB.branches.find(x=>x.id===branchId);
    br.code=code; br.name=name; br.city=city;
    addAudit(UI.companyId,'Configuración','Editó la sucursal '+name, UI.role);
    toast('Sucursal actualizada correctamente.','ok');
  }else{
    DB.branches.push({id:uid('br'), companyId:UI.companyId, code, name, city});
    addAudit(UI.companyId,'Configuración','Creó la sucursal '+name, UI.role);
    toast('Sucursal creada correctamente.','ok');
  }
  save(); App.closeModal(); renderTopbarSelectors(); rerender();
};
App.deleteBranch = function(branchId){
  if(!can(UI.role,'configuracion','FULL')) return toast('Tu rol no tiene permiso para eliminar sucursales.','danger');
  const br = DB.branches.find(x=>x.id===branchId);
  if(!br) return;
  if(currentBranches().length<=1) return toast('No puedes eliminar la única sucursal de la compañía.','danger');
  const nMov = DB.entries.filter(e=>e.branchId===branchId).length;
  if(nMov>0) return toast('No se puede eliminar "'+br.name+'": tiene '+fmtNum(nMov)+' comprobante(s) asociados. Puedes editarla, pero no eliminarla para conservar la trazabilidad.','danger');
  if(!confirm('¿Eliminar la sucursal "'+br.name+'"? Esta acción no se puede deshacer.')) return;
  DB.branches = DB.branches.filter(x=>x.id!==branchId);
  if(UI.branchId===branchId) UI.branchId='ALL';
  addAudit(UI.companyId,'Configuración','Eliminó la sucursal '+br.name, UI.role);
  save(); renderTopbarSelectors(); rerender(); toast('Sucursal eliminada correctamente.','ok');
};

/* ---------------------------- Gestión de contraseñas por rol ---------------------- */
App.openSetPasswordModal = function(role){
  if(!can(UI.role,'configuracion','FULL')) return toast('Tu rol no tiene permiso para gestionar contraseñas de roles.','danger');
  const hasPass = roleHasPassword(role);
  App.openModal((hasPass?'Cambiar':'Establecer')+' contraseña — '+ROLE_LABELS[role], `
    ${pwFieldHtml('fNewPass1','Nueva contraseña','Mínimo 4 caracteres')}
    ${pwFieldHtml('fNewPass2','Confirmar contraseña','Repite la contraseña')}
    <div class="notice info">Quien seleccione el rol <b>${ROLE_LABELS[role]}</b> en el inicio de sesión o en el selector de la barra superior deberá ingresar esta contraseña para acceder, una vez por sesión de navegador.</div>
  `, `<button class="btn" onclick="App.closeModal()">Cancelar</button><button class="btn primary" onclick="App.saveRolePassword('${role}')">Guardar contraseña</button>`);
};
App.saveRolePassword = function(role){
  if(!can(UI.role,'configuracion','FULL')) return toast('Tu rol no tiene permiso para gestionar contraseñas de roles.','danger');
  const b = modalBody();
  const p1 = b.querySelector('#fNewPass1').value;
  const p2 = b.querySelector('#fNewPass2').value;
  if(p1.length<4) return toast('La contraseña debe tener al menos 4 caracteres.','danger');
  if(p1!==p2) return toast('Las contraseñas no coinciden.','danger');
  DB.roleAuth[role] = {hash: simpleHash(p1), plain: p1};
  UI.unlockedRoles.add(role); // quien la acaba de definir no queda bloqueado de su propia acción
  addAudit(UI.companyId,'Seguridad','Estableció/cambió la contraseña del rol '+ROLE_LABELS[role], UI.role);
  save(); App.closeModal(); rerender(); toast('Contraseña del rol '+ROLE_LABELS[role]+' actualizada.','ok');
};
App.removeRolePassword = function(role){
  if(!can(UI.role,'configuracion','FULL')) return toast('Tu rol no tiene permiso para gestionar contraseñas de roles.','danger');
  if(!confirm('¿Quitar la protección por contraseña del rol '+ROLE_LABELS[role]+'? Cualquiera podrá entrar a ese rol sin contraseña.')) return;
  delete DB.roleAuth[role];
  addAudit(UI.companyId,'Seguridad','Quitó la protección por contraseña del rol '+ROLE_LABELS[role], UI.role);
  save(); rerender(); toast('Protección removida del rol '+ROLE_LABELS[role]+'.','ok');
};
App.revealRolePassword = function(role){
  if(!can(UI.role,'configuracion','FULL')) return toast('Tu rol no tiene permiso para consultar contraseñas de roles.','danger');
  const rec = DB.roleAuth[role];
  addAudit(UI.companyId,'Seguridad','Super administrador consultó la contraseña del rol '+ROLE_LABELS[role], UI.role);
  save();
  const body = (rec && rec.plain)
    ? `<div class="notice warn">Solo el Super administrador puede ver esta contraseña. Esta consulta queda registrada en Auditoría.</div>
       <div class="field"><label>Contraseña actual de ${ROLE_LABELS[role]}</label><input type="text" readonly value="${esc(rec.plain)}" class="mono" onclick="this.select()" style="font-size:16px; font-weight:600;"></div>`
    : `<div class="notice danger">Esta contraseña se estableció antes de habilitar la consulta en texto plano, así que no está disponible para ver. Puedes asignar una nueva desde aquí.</div>`;
  App.openModal('Contraseña del rol — '+ROLE_LABELS[role], body,
    rec && rec.plain
      ? `<button class="btn" onclick="App.closeModal()">Cerrar</button><button class="btn primary" onclick="App.closeModal(); App.openSetPasswordModal('${role}');">Cambiarla ahora</button>`
      : `<button class="btn" onclick="App.closeModal()">Cerrar</button><button class="btn primary" onclick="App.closeModal(); App.openSetPasswordModal('${role}');">Asignar nueva contraseña</button>`);
};

/* ============================== LOGIN ================================================ */
function loginPasswordFieldHtml(role){
  if(roleHasPassword(role)){
    return pwFieldHtml('loginPass','Contraseña del rol '+ROLE_LABELS[role],'Escribe la contraseña', {onEnter:'App.attemptLogin()'});
  }
  return `<div class="notice info">Este rol no tiene contraseña asignada todavía. Puedes ingresar directamente.</div>`;
}
function roleTileHtml(r, on){
  return `<button type="button" class="role-tile" data-role="${r}" aria-pressed="${on?'true':'false'}" onclick="App.pickLoginRole('${r}')">
    <span class="av">${initials(ROLE_USER[r])}</span>
    <span class="rt"><span class="rn">${ROLE_LABELS[r]}</span><span class="ru">${esc(ROLE_USER[r])}</span></span>
    ${roleHasPassword(r)?icon('lock','sm'):''}
  </button>`;
}
function renderLogin(){
  const app = document.getElementById('app');
  const c = DB.companies[0];
  const bs = balanceSheet(c.id, 'ALL');
  const role = ROLES[0];
  app.innerHTML = `
  <div class="login-wrap">
    <div class="login-tools">
      <button class="btn ghost icon" data-glass-btn onclick="App.toggleGlass()"></button>
      <button class="btn ghost icon" data-theme-btn onclick="App.toggleTheme()"></button>
    </div>
    <section class="login-hero">
      <div class="brand"><div class="logo">${icon('ledger')}</div><span class="brand-name">Contafi</span></div>
      <div>
        <h1>Núcleo financiero-contable</h1>
        <p>${esc(c.name)} · <span class="mono">NIT ${esc(c.nit)}</span></p>
      </div>
      <div class="feature-chips">
        <span class="feature-chip">${icon('scale')}Partida doble validada</span>
        <span class="feature-chip">${icon('shield')}Trazabilidad absoluta</span>
        <span class="feature-chip">${icon('building')}Multi-empresa</span>
        <span class="feature-chip">${icon('mapPin')}Multi-sucursal</span>
      </div>
      <div class="eq-card" aria-label="Ecuación contable de ${esc(c.name)}">
        <div class="eq-head"><span class="dot"></span>Ecuación contable · hoy</div>
        <div class="eq-row">
          <div><span class="t">Activo</span><span class="n">${fmtMoney(bs.activo)}</span></div>
          <span class="eq-op">=</span>
          <div><span class="t">Pasivo</span><span class="n">${fmtMoney(bs.pasivo)}</span></div>
          <span class="eq-op">+</span>
          <div><span class="t">Patrimonio</span><span class="n">${fmtMoney(bs.patrimonio)}</span></div>
          <span class="eq-ok ${bs.cuadra?'':'bad'}" title="${bs.cuadra?'Cuadra':'No cuadra'}">${icon(bs.cuadra?'check':'alert','sm')}</span>
        </div>
      </div>
    </section>
    <section class="login-card" aria-labelledby="loginTitle">
      <div>
        <h2 id="loginTitle">Ingresar</h2>
        <p class="login-lead">Elige tu rol; cada uno ve solo los módulos que le corresponden.</p>
      </div>
      <div>
        <span class="lbl-inline" id="roleGroupLbl">Rol</span>
        <div class="role-grid" role="group" aria-labelledby="roleGroupLbl">${ROLES.map(r=>roleTileHtml(r, r===role)).join('')}</div>
        <input type="hidden" id="loginRoleSelect" value="${role}">
      </div>
      <div id="loginPassHost">${loginPasswordFieldHtml(role)}</div>
      <div id="loginError" class="notice danger" role="alert" style="display:none;"></div>
      <button class="btn primary block" onclick="App.attemptLogin()">Ingresar${icon('arrowRight')}</button>
      <div class="help-note">${icon('info')}<span>¿Olvidaste tu contraseña? Solicítala al <b>Super administrador</b>: puede consultarla o restablecerla en Configuración → Seguridad de roles.</span></div>
    </section>
    <div class="login-foot">Prototipo funcional · Datos de demostración, no reemplaza software certificado ante la DIAN.</div>
  </div>`;
  applyAppearance();
  setTimeout(()=>{ const i=document.getElementById('loginPass'); if(i) i.focus(); else { const t=document.querySelector('.role-tile[aria-pressed="true"]'); if(t) t.focus(); } }, 30);
}
App.pickLoginRole = function(role){
  document.getElementById('loginRoleSelect').value = role;
  document.querySelectorAll('.role-tile').forEach(b=>b.setAttribute('aria-pressed', b.dataset.role===role?'true':'false'));
  App.onLoginRoleChange(role);
};
App.onLoginRoleChange = function(role){
  document.getElementById('loginPassHost').innerHTML = loginPasswordFieldHtml(role);
  const err = document.getElementById('loginError'); if(err) err.style.display='none';
  const i = document.getElementById('loginPass'); if(i) i.focus();
};
App.attemptLogin = function(){
  const role = document.getElementById('loginRoleSelect').value;
  const rec = DB.roleAuth[role];
  const passInput = document.getElementById('loginPass');
  const pass = passInput ? passInput.value : '';
  if(rec && rec.hash && simpleHash(pass) !== rec.hash){
    addAudit(UI.companyId,'Seguridad','Intento fallido de inicio de sesión en el rol '+ROLE_LABELS[role], role);
    save();
    const err = document.getElementById('loginError');
    err.style.display='block'; err.textContent='Contraseña incorrecta. Inténtalo de nuevo.';
    if(passInput){ passInput.value=''; passInput.focus(); }
    return;
  }
  UI.role = role;
  UI.unlockedRoles.add(role);
  addAudit(UI.companyId,'Seguridad','Inicio de sesión en el rol '+ROLE_LABELS[role], role);
  save();
  renderShell();
  window.scrollTo(0,0);
};

/* ============================== INIT ================================================ */
function init(){
  load();
  migrateRoleAuth();
  UI.unlockedRoles = new Set();
  const prefs = loadPrefs();
  const mq = q=> !!(window.matchMedia && window.matchMedia(q).matches);
  UI.theme = prefs.theme || (mq('(prefers-color-scheme: dark)') ? 'dark' : 'light');
  UI.glass = prefs.glass || (mq('(prefers-reduced-transparency: reduce)') ? 'off' : 'on');
  applyAppearance();
  document.addEventListener('keydown', (e)=>{
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){
      const s = document.getElementById('navSearch');
      if(!s) return;
      e.preventDefault();
      if(window.innerWidth<=880) App.toggleSidebar(true);
      s.focus(); s.select();
    }
  });
  renderLogin();
}
init();
</script>
