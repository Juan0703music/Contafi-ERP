/* "Reducir transparencia": superficies sólidas, sin desenfoque (equipos lentos o preferencia del usuario). */
:root[data-glass="off"]{
  --glass:var(--solid);
  --dense:var(--solid);
  --sheet:var(--solid);
  --glass-border:var(--line-strong);
  --dense-border:var(--line-strong);
  --glass-shadow:0 1px 2px rgba(0,0,0,.06);
  --dense-shadow:0 1px 2px rgba(0,0,0,.06);
  --btn-bg:var(--solid);
  --btn-border:var(--line-strong);
  --btn-shadow:none;
  --toast-bg:#0B1A17;
}
:root[data-glass="off"] *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;}
:root[data-glass="off"] body::before{background-image:none;}

/* ---- Base ---- */
*{box-sizing:border-box;}
html{height:100%; scroll-padding-top:96px;}
body{
  margin:0; min-height:100%; color:var(--ink); background-color:var(--paper);
  font-family:'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background-color:var(--paper); background-image:var(--ambient);}
h1,h2,h3{font-family:inherit; letter-spacing:-.02em;}
.mono, .num, td.num, .code{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric:tabular-nums;}
.tnum{font-variant-numeric:tabular-nums;}
a{color:var(--accent-text);}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.ic{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}
.ic.sm{width:14px; height:14px;}
.hint{font-size:12.5px; color:var(--ink-faint);}

/* ---- Materiales ---- */
.glass, .sidebar, .topbar, .kpi-card, .ledger-strip, .login-card, .tabbar, .panel.glass, .feature-chip, .eq-card{
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%); backdrop-filter:blur(var(--blur)) saturate(180%);
  border:1px solid var(--glass-border); box-shadow:var(--glass-shadow);
}
.panel{
  background:var(--dense);
  -webkit-backdrop-filter:blur(30px) saturate(160%); backdrop-filter:blur(30px) saturate(160%);
  border:1px solid var(--dense-border); box-shadow:var(--dense-shadow);
  border-radius:24px; margin-bottom:20px; overflow:hidden;
}

/* ---- Estructura ---- */
#app{
  min-height:100vh; display:flex; gap:16px; padding:16px;
  padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
}
.sidebar{
  width:264px; flex:0 0 264px; position:sticky; top:16px; height:calc(100vh - 32px);
  border-radius:28px; padding:20px 12px 12px; display:flex; flex-direction:column; gap:14px;
  overflow-y:auto; z-index:30; scrollbar-width:thin;
}
.brand{display:flex; align-items:center; gap:12px; padding:0 8px;}
.logo{
  width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  color:var(--accent-ink); background-color:var(--accent);
  background-image:linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,0) 62%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 14px -4px var(--accent-glow);
}
.logo .ic{width:22px; height:22px; stroke-width:2.2;}
.brand-name{font-size:18px; font-weight:700; letter-spacing:-.02em; line-height:1.2;}
.brand-sub{font-size:12px; color:var(--ink-faint);}
.side-search{
  display:flex; align-items:center; gap:10px; height:40px; padding:0 8px 0 12px; margin:2px 2px 0; border-radius:12px;
  background:var(--chip-bg); border:1px solid var(--chip-border); box-shadow:var(--field-inset); color:var(--ink-faint); cursor:text;
}
.side-search .ic{width:16px; height:16px;}
.sidebar .side-search input{flex:1; min-width:0; height:auto; padding:0; border:none; border-radius:0; background:transparent; box-shadow:none; font-size:13px; color:var(--ink);}
.sidebar .side-search input:focus{box-shadow:none;}
.side-search:focus-within{border-color:var(--accent-border); box-shadow:var(--field-inset),0 0 0 3px var(--focus-ring);}
.kbd{font-family:'Geist Mono',monospace; font-size:11px; font-weight:500; padding:3px 6px; border-radius:6px; background:var(--chip-bg); border:1px solid var(--line-strong); color:var(--ink-soft); white-space:nowrap;}
#navHost{display:flex; flex-direction:column; gap:12px; flex:1;}
.nav-group{display:flex; flex-direction:column; gap:1px;}
.nav-group-label{font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); padding:0 12px 4px;}
.nav-empty{font-size:13px; color:var(--ink-faint); padding:8px 12px;}
.nav-item{
  display:flex; align-items:center; gap:12px; width:100%; min-height:36px; padding:0 12px; border-radius:12px;
  color:var(--ink-soft); font-size:14px; font-weight:500; text-align:left; cursor:pointer; user-select:none;
  background:none; border:1px solid transparent;
}
.nav-item:hover{background:var(--surface-2); color:var(--ink);}
.nav-item.active{background:var(--nav-active); border-color:var(--nav-active-border); color:var(--nav-active-ink); font-weight:600; box-shadow:var(--nav-active-shadow);}
.nav-item .lbl{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.nav-item.locked{opacity:.4; cursor:not-allowed;}
.nav-item.locked:hover{background:transparent; color:var(--ink-soft);}
.nav-badge{font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; padding:2px 7px; border-radius:999px; background:var(--neutral-soft); color:var(--ink-soft);}
.nav-badge.warn{background:var(--warn-soft); color:var(--warn);}
.nav-dot{width:8px; height:8px; border-radius:50%; background:var(--warn-dot); box-shadow:0 0 0 3px var(--warn-soft); flex-shrink:0;}
.side-foot{display:flex; align-items:center; gap:12px; padding:12px; border-radius:18px; background:var(--chip-bg); border:1px solid var(--chip-border);}
.side-foot .badge-ic{width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--accent-soft); color:var(--accent-text);}
.side-foot.bad .badge-ic{background:var(--danger-soft); color:var(--danger);}
.side-foot b{display:block; font-size:13px; font-weight:600; line-height:1.3;}
.side-foot span{font-size:12px; color:var(--ink-faint);}
.side-scrim{display:none;}
.side-actions{display:none;}

.main{flex:1; min-width:0; display:flex; flex-direction:column; gap:20px;}
.topbar{
  position:sticky; top:16px; z-index:25; min-height:64px; border-radius:22px; padding:10px;
  display:flex; align-items:center; gap:10px;
}
.spacer{flex:1;}
.chip{
  margin:0; font-weight:400;
  position:relative; display:inline-flex; align-items:center; gap:10px; height:44px; padding:0 14px 0 8px; border-radius:999px;
  background:var(--btn-bg); border:1px solid var(--btn-border); box-shadow:var(--btn-shadow); color:var(--ink); min-width:0; cursor:pointer;
}
.chip:focus-within{box-shadow:var(--btn-shadow),0 0 0 3px var(--focus-ring);}
.chip-ic{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--accent-soft); color:var(--accent-text);}
.chip-ic .ic{width:16px; height:16px;}
.chip-col{display:flex; flex-direction:column; align-items:stretch; gap:2px; min-width:0; overflow:hidden;}
.company-chip{flex-shrink:1; max-width:300px;}
.role-switch, .seg, .period{flex-shrink:0;}
.chip select{
  width:auto; max-width:100%; height:auto; padding:0 22px 0 0; border:none; border-radius:0; box-shadow:none; background-color:transparent;
  background-image:var(--chev); background-position:right 0 center; background-size:16px; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer;
  text-overflow:ellipsis;
}
.chip select:focus{box-shadow:none;}
.chip .sub{font-family:'Geist Mono',monospace; font-size:11px; font-weight:500; color:var(--ink-faint); line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.chip > .ic{color:var(--ink-faint); width:16px; height:16px;}
.role-switch{padding:0 12px 0 6px;}
.role-switch select{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; background:none; padding:0;}
.role-switch .who{display:flex; align-items:center; gap:5px; font-size:13px; font-weight:600; line-height:1.2; white-space:nowrap;}
.role-switch .role{font-size:11.5px; font-weight:500; color:var(--ink-faint); line-height:1.2; white-space:nowrap;}
.avatar{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:12px; font-weight:700; color:#fff; background:linear-gradient(135deg,#F2B35A,#DA6E3A); box-shadow:inset 0 1px 0 rgba(255,255,255,.5);}
.seg{display:flex; gap:2px; padding:4px; border-radius:999px; background:var(--seg-bg); box-shadow:inset 0 1px 2px rgba(0,0,0,.08); max-width:100%; overflow-x:auto; scrollbar-width:none;}
.seg button{height:36px; padding:0 14px; border-radius:999px; border:1px solid transparent; background:transparent; font-size:13px; font-weight:500; color:var(--ink-soft); cursor:pointer; white-space:nowrap;}
.seg button:hover{color:var(--ink);}
.seg button[aria-pressed="true"]{background:var(--seg-on); border-color:var(--seg-on-border); color:var(--ink); font-weight:600; box-shadow:var(--seg-on-shadow);}
.period{display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 12px; border-radius:999px; background:var(--chip-bg); border:1px solid var(--chip-border); font-size:13px; color:var(--ink-soft); white-space:nowrap;}
.period .ic{width:16px; height:16px;}
.period .dot{width:6px; height:6px; border-radius:50%; background:var(--accent);}
.period b{color:var(--accent-text); font-weight:600;}
.period.closed .dot{background:var(--danger);}
.period.closed b{color:var(--danger);}

.content{padding:4px 8px 0; min-width:0;}
.crumb{font-size:13px; color:var(--ink-soft); margin-bottom:6px;}
.page-head{margin-bottom:22px;}
.page-head.split{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;}
.page-head h1{font-size:34px; line-height:1.1; margin:0 0 6px; font-weight:600; letter-spacing:-.03em;}
.page-head p{margin:0; color:var(--ink-soft); font-size:14.5px; max-width:680px;}

/* ---- Indicadores ---- */
.kpi-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-bottom:16px;}
.kpi-card{border-radius:24px; padding:20px 22px; display:flex; flex-direction:column; gap:14px; min-width:0;}
.kpi-top{display:flex; align-items:center; gap:10px; min-width:0;}
.kpi-ic{width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--accent-soft); color:var(--accent-text);}
.kpi-ic .ic{width:17px; height:17px;}
.kpi-ic.indigo{background:var(--indigo-soft); color:var(--indigo-text);}
.kpi-ic.sky{background:var(--sky-soft); color:var(--sky-text);}
.kpi-ic.danger{background:var(--danger-soft); color:var(--danger);}
.kpi-ic.warn{background:var(--warn-soft); color:var(--warn);}
.kpi-label{flex:1; min-width:0; font-size:13.5px; font-weight:500; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.kpi-value{font-size:28px; line-height:1.05; font-weight:600; letter-spacing:-.025em; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.kpi-value .cur{font-size:.62em; font-weight:500; color:var(--ink-faint); margin-right:5px;}
.kpi-value.pos{color:var(--accent-text);}
.kpi-value.neg{color:var(--danger);}
.kpi-value.pos .cur, .kpi-value.neg .cur{color:inherit;}
.kpi-foot{display:flex; align-items:center; justify-content:space-between; gap:8px; min-width:0;}
.kpi-sub{font-size:12.5px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}

.ledger-strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); border-radius:22px; padding:6px; margin-bottom:20px;}
.ledger-strip.four{grid-template-columns:repeat(4,minmax(0,1fr));}
.ledger-cell{display:flex; flex-direction:column; justify-content:center; gap:3px; padding:12px 16px; border-right:1px solid var(--line); min-width:0;}
.ledger-cell:last-child{border-right:none;}
.ledger-cell.with-ic{flex-direction:row; align-items:center; justify-content:flex-start; gap:12px;}
.ledger-txt{display:flex; flex-direction:column; gap:3px; min-width:0;}
.ledger-cell .l{font-size:12.5px; color:var(--ink-faint);}
.ledger-cell .v{font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap;}
.ledger-cell .v.pos{color:var(--accent-text);}
.ledger-cell .v.neg{color:var(--danger);}
.ledger-cell .s{font-size:12px; color:var(--ink-faint);}
.ledger-ic{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--chip-bg); border:1px solid var(--chip-border); color:var(--accent-text);}
.ledger-ic.warn{color:var(--warn);}
.ledger-ic.sky{color:var(--sky-text);}

/* ---- Paneles ---- */
.panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 20px 14px; flex-wrap:wrap; border-bottom:1px solid var(--line);}
.panel.glass .panel-head{border-bottom:none; padding-bottom:4px;}
.panel-head h2{font-size:17px; margin:0; font-weight:600; letter-spacing:-.01em;}
.panel-head select{width:auto;}
.panel-sub{font-size:12.5px; color:var(--ink-faint); margin-top:3px;}
.panel-body{padding:18px 20px;}
.two-col{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:16px; margin-bottom:20px;}
.two-col > .panel{margin-bottom:0;}

/* ---- Tablas ---- */
.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  text-align:left; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint);
  padding:0 12px; height:42px; border-bottom:1px solid var(--line-strong); white-space:nowrap;
}
table thead th.num{font-family:inherit;}
tbody td{padding:12px 12px; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap;}
th:first-child, td:first-child{padding-left:20px;}
th:last-child, td:last-child{padding-right:20px;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--row-hover);}
td.wrap, th.wrap{white-space:normal; min-width:140px;}
td.cut{max-width:0; width:100%;}
td.cut > div{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
td.btn-row{display:table-cell; text-align:right; white-space:nowrap;}
td.btn-row .btn{margin-left:4px;}
.num{text-align:right; font-variant-numeric:tabular-nums;}
.panel-body table td.mono:first-child{width:110px;}
.t-right{text-align:right;}
.modal .table-wrap{border:1px solid var(--line); border-radius:16px; background:var(--well);}
.modal th:first-child, .modal td:first-child{padding-left:14px;}
.modal th:last-child, .modal td:last-child{padding-right:14px;}

/* ---- Estados ---- */
.pill{display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 10px; border-radius:999px; font-size:12px; font-weight:600; letter-spacing:.01em; white-space:nowrap; background:var(--neutral-soft); color:var(--ink-soft);}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.9;}
.pill.posted, .pill.paid{background:var(--accent-soft); color:var(--accent-text);}
.pill.draft, .pill.partial{background:var(--warn-soft); color:var(--warn);}
.pill.annulled, .pill.closed{background:var(--danger-soft); color:var(--danger);}
.pill.open{background:var(--neutral-soft); color:var(--ink-soft);}
.vtag{display:inline-flex; align-items:center; justify-content:center; min-width:34px; height:22px; padding:0 6px; border-radius:7px; font-family:'Geist Mono',monospace; font-size:11px; font-weight:600; background:var(--neutral-soft); color:var(--ink-soft);}
.vtag.t-FV{background:var(--accent-soft); color:var(--accent-text);}
.vtag.t-FC{background:var(--warn-soft); color:var(--warn);}
.vtag.t-CI{background:var(--sky-soft); color:var(--sky-text);}
.vtag.t-CE{background:var(--indigo-soft); color:var(--indigo-text);}

/* ---- Formularios ---- */
label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; font-weight:500;}
input[type=text], input[type=number], input[type=date], input[type=email], input[type=password], input[type=search], select, textarea{
  width:100%; height:44px; padding:0 14px; border:1px solid var(--field-border); border-radius:14px;
  background-color:var(--field-bg); box-shadow:var(--field-inset); color:var(--ink);
  font-family:inherit; font-size:14px; outline:none; transition:border-color .15s ease, box-shadow .15s ease;
}
textarea{height:auto; padding:10px 14px;}
select{-webkit-appearance:none; appearance:none; padding-right:38px; background-image:var(--chev); background-repeat:no-repeat; background-position:right 12px center; background-size:16px; cursor:pointer;}
input[type=number]{font-family:'Geist Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums;}
input::placeholder, textarea::placeholder{color:var(--ink-faint); opacity:.85;}
input:focus, select:focus, textarea:focus{border-color:var(--accent); box-shadow:var(--field-inset),0 0 0 4px var(--focus-ring);}
input:disabled, select:disabled{opacity:.55; cursor:not-allowed;}
input[type=checkbox]{width:18px; height:18px; accent-color:var(--accent); vertical-align:-3px;}
.field{margin-bottom:14px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
.grid4{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:14px;}
@media (max-width:700px){.grid2,.grid3,.grid4{grid-template-columns:1fr;}}

/* ---- Botones ---- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; height:44px; padding:0 18px; border-radius:999px;
  font-size:14px; font-weight:600; line-height:1; white-space:nowrap; cursor:pointer; text-decoration:none;
  color:var(--ink); background:var(--btn-bg); border:1px solid var(--btn-border); box-shadow:var(--btn-shadow);
  transition:transform .15s ease, background-color .15s ease, filter .15s ease, box-shadow .15s ease;
}
.btn:hover{background:var(--btn-hover);}
.btn:active{transform:scale(.97);}
.btn .ic{width:17px; height:17px;}
.btn.primary{
  color:var(--accent-ink); background-color:var(--accent);
  background-image:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 55%);
  border-color:rgba(255,255,255,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(0,0,0,.14),0 8px 18px -6px var(--accent-glow);
}
.btn.primary:hover{background-color:var(--accent); filter:brightness(1.07);}
.btn.danger{background:var(--danger-soft); border-color:var(--danger-border); color:var(--danger); box-shadow:none;}
.btn.danger:hover{background:var(--danger-soft); filter:brightness(1.05); border-color:var(--danger);}
.btn.ghost{background:transparent; border-color:transparent; box-shadow:none; color:var(--ink-soft);}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink);}
.btn.sm{height:34px; padding:0 13px; font-size:12.5px; gap:6px;}
.btn.sm .ic{width:15px; height:15px;}
.btn.icon{width:44px; padding:0;}
.btn.icon.on{background:var(--accent-soft); color:var(--accent-text);}
.btn.block{width:100%; height:52px; font-size:15px;}
.btn:disabled{opacity:.42; cursor:not-allowed; transform:none; filter:none; box-shadow:none;}
.btn-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.hamburger{display:none;}

.empty{padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:13.5px;}
.empty .big{margin-bottom:10px; display:flex; justify-content:center;}
.empty .big .ic{width:30px; height:30px; opacity:.7;}

.tag-line{margin:12px 0; padding:10px 14px; border-radius:12px; background:var(--well); font-size:13px; color:var(--ink-soft);}
.notice{padding:12px 14px; border-radius:14px; font-size:13px; line-height:1.5; margin-bottom:14px; border:1px solid; color:var(--ink);}
.notice.info{background:var(--accent-soft); border-color:var(--accent-border);}
.notice.info b{color:var(--accent-text);}
.notice.warn{background:var(--warn-soft); border-color:var(--warn-border);}
.notice.warn b{color:var(--warn);}
.notice.danger{background:var(--danger-soft); border-color:var(--danger-border);}
.notice.danger b{color:var(--danger);}

/* ---- Notificaciones ---- */
#toastHost{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); right:20px; z-index:100; display:flex; flex-direction:column; gap:8px; align-items:flex-end;}
.toast{
  display:flex; align-items:center; gap:10px; max-width:380px; padding:12px 16px; border-radius:16px; font-size:13px;
  background:var(--toast-bg); color:var(--toast-ink); border:1px solid rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%);
  box-shadow:0 18px 40px -12px rgba(0,0,0,.35); animation:toastIn .25s ease;
}
.toast::before{content:""; width:8px; height:8px; border-radius:50%; flex-shrink:0; background:rgba(255,255,255,.5);}
.toast.ok::before{background:#3DD9B8;}
.toast.danger::before{background:#FF8A7A;}

/* ---- Ventanas modales ---- */
.modal-back{
  position:fixed; inset:0; z-index:60; overflow-y:auto; display:flex; align-items:flex-start; justify-content:center;
  padding:6vh 16px; background:var(--scrim); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); animation:fadeIn .18s ease;
}
.modal{
  width:100%; max-width:640px; border-radius:28px; background:var(--sheet);
  -webkit-backdrop-filter:blur(40px) saturate(180%); backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--glass-border); box-shadow:var(--sheet-shadow); animation:popIn .22s cubic-bezier(.2,.8,.2,1);
}
.modal.wide{max-width:900px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 20px 16px 28px; border-bottom:1px solid var(--line);}
.modal-head h3{margin:0; font-size:20px; font-weight:600; letter-spacing:-.02em;}
.modal-body{padding:22px 28px; max-height:70vh; overflow-y:auto;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:16px 20px 20px 28px; border-top:1px solid var(--line);}
.close-x{color:var(--ink-faint);}

.entry-lines-table td input, .entry-lines-table td select{height:38px; padding:0 10px; font-size:13px; border-radius:10px;}
.entry-lines-table td select{padding-right:32px; background-position:right 8px center;}
.entry-lines-table td input[type=number]{text-align:right;}
.entry-lines-table td, .entry-lines-table th{padding-top:6px; padding-bottom:6px;}
.total-bar{
  display:flex; align-items:center; gap:10px 28px; flex-wrap:wrap; margin-top:12px; padding:14px 18px; border-radius:16px;
  background:var(--well); border:1px solid var(--line); box-shadow:var(--field-inset); font-size:13px; color:var(--ink-soft);
}
.total-bar b{font-family:'Geist Mono',monospace; font-size:14.5px; color:var(--ink); font-variant-numeric:tabular-nums;}
.balance-ok, .balance-bad{margin-left:auto; display:inline-flex; align-items:center; height:30px; padding:0 14px; border-radius:999px; font-weight:600;}
.balance-ok{background:var(--accent-soft); color:var(--accent-text); border:1px solid var(--accent-border);}
.balance-bad{background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger-border);}

.kpi-mini{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
.kpi-mini:last-child{border-bottom:none;}
.kpi-mini .dot{width:8px; height:8px; border-radius:50%; flex:0 0 8px;}
.kpi-mini .lab{flex:1; font-size:13px; color:var(--ink-soft);}
.kpi-mini .val{font-family:'Geist Mono',monospace; font-size:13px; font-weight:600;}

/* ---- Panel general ---- */
.dash-grid{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:16px; margin-bottom:16px;}
.dash-grid .panel{margin-bottom:0;}
.dash-col{display:flex; flex-direction:column; gap:16px; min-width:0;}
.dash-col .panel{flex:1 0 auto;}
.chart-legend{display:flex; gap:16px; font-size:12.5px; color:var(--ink-soft);}
.legend-item{display:inline-flex; align-items:center; gap:7px;}
.sw{display:inline-block; width:10px; height:10px; border-radius:3px; flex-shrink:0;}
.chart-box{position:relative; height:250px;}
.donut-wrap{display:flex; align-items:center; gap:20px;}
.donut-box{position:relative; width:168px; height:168px; flex-shrink:0;}
.donut-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none;}
.donut-center b{font-size:18px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
.donut-center span{font-size:11.5px; color:var(--ink-faint);}
.exp-legend{flex:1; display:flex; flex-direction:column; gap:12px; min-width:0;}
.exp-row{display:flex; align-items:flex-start; gap:10px;}
.exp-row .sw{margin-top:4px;}
.exp-row .tx{flex:1; min-width:0;}
.exp-row .nm{display:block; font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.exp-row .am{font-size:12px; color:var(--ink-faint);}
.exp-row .pc{font-size:12.5px; font-weight:600;}
.big-num{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.big-num .tnum{font-size:26px; font-weight:600; letter-spacing:-.02em;}
.stack-bar{display:flex; gap:3px; height:8px; margin:14px 0 16px;}
.stack-bar span{border-radius:999px; min-width:4px;}
.list-rows{display:flex; flex-direction:column; gap:12px;}
.list-row{display:flex; align-items:center; gap:12px; min-width:0;}
.list-row .dotc{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.list-row .tx{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
.list-row .nm{font-size:13.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.list-row .sb{font-size:11.5px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.list-row .am{font-size:13px; font-weight:600; white-space:nowrap;}
.alert-row{display:flex; align-items:center; gap:12px; padding:12px; border-radius:16px; background:var(--chip-bg); border:1px solid var(--chip-border);}
.alert-ic{width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--warn-soft); color:var(--warn);}
.alert-ic.danger{background:var(--danger-soft); color:var(--danger);}
.alert-row .am.warn{color:var(--warn);}
.alert-row .am.danger{color:var(--danger);}
.stack-gap{display:flex; flex-direction:column; gap:10px;}

/* ---- Asistente ---- */
.chat-box{overflow:hidden;}
.chat-log{max-height:420px; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:10px;}
.msg{max-width:78%; padding:10px 14px; border-radius:18px; font-size:13.5px; line-height:1.5;}
.msg.user{align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:6px;}
.msg.bot{align-self:flex-start; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-bottom-left-radius:6px;}
.suggest-row{display:flex; gap:8px; flex-wrap:wrap; padding:0 20px 14px;}
.suggest-chip{font-size:12.5px; padding:7px 12px; border-radius:999px; cursor:pointer; color:var(--ink-soft); background:var(--btn-bg); border:1px solid var(--btn-border); box-shadow:var(--btn-shadow);}
.suggest-chip:hover{color:var(--ink); background:var(--btn-hover);}
.chat-input{display:flex; gap:10px; padding:14px 16px; border-top:1px solid var(--line);}
.chat-input input{flex:1;}
.chat-input button{
  height:44px; padding:0 20px; border-radius:999px; font-weight:600; cursor:pointer; color:var(--accent-ink); background-color:var(--accent);
  background-image:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 55%); border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 8px 18px -6px var(--accent-glow);
}

/* ---- Plan de cuentas ---- */
.acct-tree-row{display:flex; gap:10px; padding:9px 20px; border-bottom:1px solid var(--line); font-size:13px; align-items:center;}
.acct-tree-row:last-child{border-bottom:none;}
.acct-tree-row .code{width:76px; flex:0 0 76px; color:var(--ink-faint);}
.acct-tree-row .nm{flex:1;}
.acct-tree-row.lvl1{font-weight:700; background:var(--well);}
.acct-tree-row.lvl2{font-weight:600; padding-left:34px;}
.acct-tree-row.lvl3{padding-left:50px; color:var(--ink-soft);}

footer.appfoot{padding:8px 8px 24px; color:var(--ink-faint); font-size:12px;}

/* ---- Acceso ---- */
.login-wrap{position:relative; flex:1; min-height:calc(100vh - 32px); display:flex; align-items:center; justify-content:center; gap:72px; padding:40px 48px 72px;}
.login-tools{position:absolute; top:0; right:0; display:flex; gap:6px;}
.login-hero{flex:1; max-width:620px; min-width:0; display:flex; flex-direction:column; gap:26px;}
.login-hero .logo{width:52px; height:52px; border-radius:16px;}
.login-hero .logo .ic{width:28px; height:28px;}
.login-hero .brand{padding:0;}
.login-hero .brand-name{font-size:26px;}
.login-hero h1{margin:0 0 12px; font-size:clamp(40px,5vw,64px); line-height:1.02; letter-spacing:-.045em; font-weight:600;}
.login-hero p{margin:0; font-size:17px; color:var(--ink-soft);}
.feature-chips{display:flex; flex-wrap:wrap; gap:10px;}
.feature-chip{display:inline-flex; align-items:center; gap:10px; height:44px; padding:0 16px 0 12px; border-radius:999px; font-size:14px; font-weight:500; color:var(--ink-soft);}
.feature-chip .ic{color:var(--accent-text);}
.eq-card{align-self:flex-start; border-radius:24px; padding:18px 22px; display:flex; flex-direction:column; gap:12px; transform:rotate(-2deg);}
.eq-head{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft);}
.eq-head .dot{width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
.eq-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.eq-row .t{display:block; font-size:12px; color:var(--ink-faint);}
.eq-row .n{font-family:'Geist Mono',monospace; font-size:17px; font-weight:600; font-variant-numeric:tabular-nums;}
.eq-op{font-size:20px; color:var(--ink-faint);}
.eq-ok{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent-text);}
.eq-ok.bad{background:var(--danger-soft); color:var(--danger);}
.login-card{width:100%; max-width:480px; flex-shrink:0; border-radius:32px; padding:34px 36px; display:flex; flex-direction:column; gap:20px;}
.login-card h2{margin:0 0 6px; font-size:28px; font-weight:600; letter-spacing:-.025em;}
.login-lead{margin:0; font-size:14px; color:var(--ink-soft);}
.lbl-inline{display:block; font-size:12.5px; font-weight:500; color:var(--ink-soft); margin-bottom:8px;}
.login-card .field{margin-bottom:0;}
.login-card .notice{margin-bottom:0;}
.role-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
.role-tile{
  display:flex; align-items:center; gap:10px; min-height:60px; padding:8px 10px; border-radius:16px; min-width:0; text-align:left; cursor:pointer;
  color:var(--ink); background:var(--chip-bg); border:1px solid var(--chip-border); transition:background-color .15s ease, box-shadow .15s ease;
}
.role-tile:hover{background:var(--btn-hover);}
.role-tile[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent-border); box-shadow:0 0 0 3px var(--focus-ring);}
.role-tile .av{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:11px; font-weight:700; background:var(--neutral-soft); color:var(--ink-soft);}
.role-tile[aria-pressed="true"] .av{background:var(--accent); color:var(--accent-ink);}
.role-tile .rt{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
.role-tile .rn{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.role-tile .ru{font-size:12px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.role-tile > .ic{color:var(--ink-faint);}
.help-note{display:flex; gap:10px; padding:12px 14px; border-radius:16px; background:var(--well); border:1px solid var(--line); font-size:12.5px; line-height:1.5; color:var(--ink-soft);}
.help-note .ic{width:16px; height:16px; margin-top:1px; color:var(--ink-faint);}
.login-foot{position:absolute; left:0; right:0; bottom:8px; text-align:center; font-size:12px; color:var(--ink-faint); padding:0 16px;}
.pw-wrap{position:relative;}
.pw-wrap input[type]{padding-right:50px;}
.pw-eye{position:absolute; right:4px; top:50%; transform:translateY(-50%); width:38px; height:38px; border-radius:11px; border:none; background:none; color:var(--ink-faint); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.pw-eye:hover{color:var(--ink); background:var(--surface-2);}

/* ---- Barra de pestañas (móvil) ---- */
.tabbar{display:none;}
.tab{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; width:64px; height:52px; border-radius:26px; border:none; background:transparent; color:var(--ink-soft); font-size:11px; font-weight:600; cursor:pointer;}
.tab .ic{width:20px; height:20px;}
.tab.active{background:var(--nav-active); color:var(--nav-active-ink); box-shadow:var(--nav-active-shadow);}
.tab:disabled{opacity:.4; cursor:not-allowed;}
.tab-fab{width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;
  color:var(--accent-ink); background-color:var(--accent); background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%);
  border:1px solid rgba(255,255,255,.3); box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 18px -6px var(--accent-glow);}
.tab-fab .ic{width:24px; height:24px; stroke-width:2.2;}
.tab-fab:disabled{opacity:.45; cursor:not-allowed; box-shadow:none;}

/* ---- Animación ---- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0; transform:translateY(8px) scale(.98)}to{opacity:1; transform:none}}
@keyframes toastIn{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important; transition:none!important;}}

/* ---- Adaptable ---- */
@media (max-height:940px){ .side-foot{display:none;} }
@media (max-width:1500px){ .period{display:none;} }
@media (max-width:1280px){
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .company-chip .sub{display:none;}
  .ledger-strip.four{grid-template-columns:repeat(2,minmax(0,1fr));}
  .ledger-strip.four .ledger-cell:nth-child(2n){border-right:none;}
  .ledger-strip.four .ledger-cell:nth-child(-n+2){border-bottom:1px solid var(--line);}
  .role-switch .chip-col{display:none;}
}
@media (max-width:1100px){
  .dash-grid, .two-col{grid-template-columns:minmax(0,1fr);}
}
@media (max-width:980px){
  .login-wrap{flex-direction:column; align-items:stretch; gap:28px; padding:56px 4px 64px;}
  .login-hero{max-width:none; gap:18px;}
  .login-hero h1{font-size:40px;}
  .eq-card{display:none;}
  .login-card{max-width:none; padding:26px 22px;}
}
@media (max-width:880px){
  #app{padding:10px; gap:0;}
  .sidebar{position:fixed; left:10px; top:10px; bottom:10px; height:auto; transform:translateX(calc(-100% - 24px)); transition:transform .22s ease; z-index:50;}
  .sidebar.open{transform:none;}
  .side-scrim.show{display:block; position:fixed; inset:0; z-index:45; background:var(--scrim);}
  .hamburger{display:inline-flex;}
  .main{gap:16px;}
  .topbar{position:relative; top:auto; flex-wrap:wrap; border-radius:20px; padding:8px;}
  #branchHost{order:10; width:100%;}
  .topbar .seg{width:100%;}
  .seg button{padding:0 11px;}
  .topbar .hide-sm, .topbar .spacer{display:none;}
  .company-chip{flex:1; max-width:none;}
  .kpi-foot{flex-direction:column; align-items:flex-start;}
  .ledger-strip.four{grid-template-columns:minmax(0,1fr);}
  .ledger-strip.four .ledger-cell{border-right:none;}
  .side-actions{display:flex; gap:6px; justify-content:space-between; padding-top:4px;}
  .side-actions .btn{flex:1;}
  .company-chip .sub{display:none;}
  .company-chip select{max-width:150px;}
  .content{padding:0 2px 100px;}
  .page-head h1{font-size:28px;}
  .kpi-grid{gap:10px;}
  .kpi-card{padding:14px; gap:8px; border-radius:20px;}
  .kpi-ic{display:none;}
  .kpi-value{font-size:19px;}
  .kpi-sub{white-space:normal;}
  .ledger-cell{border-right:none; border-bottom:1px solid var(--line);}
  .ledger-cell:last-child{border-bottom:none;}
  .donut-wrap{flex-direction:column; align-items:stretch;}
  .donut-box{align-self:center;}
  .tabbar{display:flex; position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); height:68px; border-radius:34px; padding:0 8px; align-items:center; justify-content:space-between; z-index:40;}
  #toastHost{left:16px; right:16px; bottom:calc(96px + env(safe-area-inset-bottom,0px)); align-items:stretch;}
  .toast{max-width:none;}
  footer.appfoot{padding-bottom:100px;}
  .modal-back{padding:12px;}
  .modal{border-radius:24px;}
  .modal-body{padding:18px;}
  .modal-head, .modal-foot{padding-left:18px; padding-right:14px;}
}

/* ---- Impresión: reportes limpios y opacos ---- */
@media print{
  body::before{display:none;}
  body{background:#fff; color:#000;}
  .sidebar, .topbar, .tabbar, #toastHost, .appfoot, .side-scrim, .page-head .btn-row{display:none!important;}
  #app{padding:0; display:block;}
  .panel, .kpi-card, .ledger-strip, .panel.glass{background:#fff!important; box-shadow:none!important; border:1px solid #ccc!important; -webkit-backdrop-filter:none!important; backdrop-filter:none!important; break-inside:avoid;}
}
</style>

function icon(name, cls){ return `<svg class="ic${cls?' '+cls:''}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]||''}</svg>`; }
/* Monto con el signo de pesos en tamaño menor (tarjetas de indicadores). */
function moneyHtml(n){ return fmtMoney(n).replace(/^(-?)\$\s*/, (m,neg)=>`<span class="cur">${neg?'−':''}$</span>`); }
function fmtPct(v){ return (Number(v)||0).toLocaleString('es-CO',{maximumFractionDigits:1})+' %'; }
function fmtCompact(n){
  const a = Math.abs(n);
  if(a>=1e6) return (n<0?'−':'')+'$ '+(a/1e6).toLocaleString('es-CO',{maximumFractionDigits:1})+' M';
  return fmtMoney(n);
}
function initials(name){ return String(name||'').replace(/\./g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function normTxt(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
/* Paleta de series (mismo orden en gráficas y leyendas). */
const SERIES_VARS = ['--accent','--credit','--indigo','--sky','--warn-dot','--ink-faint'];
/* Hash simple y determinístico (no criptográfico) para el bloqueo de roles en el navegador.
   No sustituye autenticación real de servidor — ver nota en Configuración > Seguridad. */
function simpleHash(str){
  str = String(str);
  let h1 = 0xdeadbeef ^ 0, h2 = 0x41c6ce57 ^ 0;
  for(let i=0;i<str.length;i++){
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (4294967296*(2097151 & h2) + (h1>>>0)).toString(36);

/* ---------------------------- Motor de partida doble ---------------------- */
function postEntry(opts){
  const {companyId, branchId, voucherType, date, concept, lines, role, sourceType, sourceId} = opts;
  let td=0, tc=0;
  lines.forEach(l=>{ td += Math.round(l.debit||0); tc += Math.round(l.credit||0); });
  if(td !== tc){
    throw new Error('El comprobante no está balanceado: Débitos '+fmtMoney(td)+' ≠ Créditos '+fmtMoney(tc)+'. ΣDébitos debe ser igual a ΣCréditos.');
  }
  if(td===0){ throw new Error('El comprobante no tiene movimientos.'); }
  const ym = ymOf(date);
  if(isPeriodClosed(companyId, ym)){
    throw new Error('El período contable '+monthLabel(ym)+' está cerrado. No se pueden registrar nuevos comprobantes en esa fecha.');
  }
  const canFull = can(role,'contabilidad','APPROVE');
  const status = canFull ? 'POSTED' : 'DRAFT';
  const entry = {
    id: uid('ent'), companyId, branchId, voucherType,
    number: nextNumber(companyId, voucherType),
    date, concept, status, sourceType:sourceType||'MANUAL', sourceId:sourceId||null,
    createdBy: role, createdAt: new Date().toISOString(),
    lines: lines.map(l=>({...l, debit:Math.round(l.debit||0), credit:Math.round(l.credit||0)})),
  };
  DB.entries.push(entry);
  addAudit(companyId, 'Contabilidad', (status==='POSTED'?'Contabilizó':'Guardó borrador de')+' comprobante '+entry.number+' — '+concept, role);
  save();
  return entry;
}
function approveEntry(entryId, role){
  if(!can(role,'contabilidad','APPROVE')) throw new Error('Tu rol no tiene permiso para aprobar comprobantes.');
  const e = DB.entries.find(x=>x.id===entryId);
  if(!e) return;
  if(e.status!=='DRAFT') throw new Error('Solo los comprobantes en borrador pueden aprobarse.');
  const ym = ymOf(e.date);
  if(isPeriodClosed(e.companyId, ym)) throw new Error('El período '+monthLabel(ym)+' está cerrado.');
  e.status='POSTED'; e.approvedBy=role; e.approvedAt=new Date().toISOString();
  addAudit(e.companyId,'Contabilidad','Aprobó y contabilizó comprobante '+e.number, role);
  save();
}
function annulEntry(entryId, role, reason){
  if(!can(role,'contabilidad','APPROVE')) throw new Error('Tu rol no tiene permiso para anular comprobantes.');
  const e = DB.entries.find(x=>x.id===entryId);
  if(!e) return;
  if(e.status==='ANNULLED') return;
  e.status='ANNULLED'; e.annulledBy=role; e.annulledAt=new Date().toISOString(); e.annulReason=reason||'';
  addAudit(e.companyId,'Contabilidad','Anuló comprobante '+e.number+(reason?' — Motivo: '+reason:''), role);
  save();
}

/* ---------------------------- Consultas contables -------------------------- */
function accountMovements(companyId, code, opts){
  opts = opts||{};
  const rows=[];
  DB.entries.filter(e=>e.companyId===companyId && e.status==='POSTED' && (!opts.branchId || opts.branchId==='ALL' || e.branchId===opts.branchId))
    .forEach(e=>{
      e.lines.forEach(l=>{
        if(l.accountCode===code && (l.debit||l.credit)){
          rows.push({entry:e, line:l});
        }
      });
    });
  rows.sort((a,b)=> a.entry.date.localeCompare(b.entry.date) || a.entry.number.localeCompare(b.entry.number));
  return rows;
}
function accountBalance(companyId, code, branchId){
  const rows = accountMovements(companyId, code, {branchId});
  let d=0,c=0; rows.forEach(r=>{ d+=r.line.debit; c+=r.line.credit; });
  return {debit:d, credit:c, balance:d-c};
}
function trialBalance(companyId, branchId){
  return leafAccounts(companyId).map(a=>{
    const b = accountBalance(companyId, a.code, branchId);
    return {account:a, ...b};
  }).filter(r=>r.debit!==0 || r.credit!==0);
}
function sumClass(companyId, prefix, branchId){
  let d=0,c=0;
  leafAccounts(companyId).filter(a=>a.code.startsWith(prefix)).forEach(a=>{
    const b=accountBalance(companyId,a.code,branchId); d+=b.debit; c+=b.credit;
  });
  return {debit:d, credit:c};
}
function incomeStatement(companyId, branchId){
  const ing = sumClass(companyId,'4',branchId);     // ingresos: naturaleza crédito
  const cos = sumClass(companyId,'6',branchId);     // costo de ventas: naturaleza débito
  const gas = sumClass(companyId,'5',branchId);     // gastos: naturaleza débito
  const ingresos = ing.credit - ing.debit;
  const costos = cos.debit - cos.credit;
  const gastos = gas.debit - gas.credit;
  const utilidadBruta = ingresos - costos;
  const utilidadNeta = utilidadBruta - gastos;
  return {ingresos, costos, gastos, utilidadBruta, utilidadNeta};
}
function balanceSheet(companyId, branchId){
  const act = sumClass(companyId,'1',branchId);
  const pas = sumClass(companyId,'2',branchId);
  const pat = sumClass(companyId,'3',branchId);
  const activo = act.debit - act.credit;
  const pasivo = pas.credit - pas.debit;
  const patrimonioBase = pat.credit - pat.debit;
  const {utilidadNeta} = incomeStatement(companyId, branchId);
  const patrimonio = patrimonioBase + utilidadNeta;
  return {activo, pasivo, patrimonio, utilidadNeta, cuadra: Math.abs(activo-(pasivo+patrimonio))<1};
}
function bankBalance(bankAccountId){
  let bal=0;
  DB.entries.filter(e=>e.status==='POSTED').forEach(e=>{
    e.lines.forEach(l=>{ if(l.bankAccountId===bankAccountId){ bal += (l.debit-l.credit); } });
  });
  return bal;
}
function totalCash(companyId){
  return bankAccountsOf(companyId).reduce((s,b)=>s+bankBalance(b.id),0) + accountBalance(companyId,'1105').balance;
}
function invoiceBalance(inv){ return Math.max(0, inv.total - inv.paidAmount); }
function billBalance(bill){ return Math.max(0, bill.total - bill.paidAmount); }
function invoiceStatus(inv){ if(inv.paidAmount<=0) return 'open'; if(inv.paidAmount>=inv.total) return 'paid'; return 'partial'; }

/* ---------------------------- Ventas --------------------------------------- */
function createSalesInvoice(o){
  const {companyId, branchId, thirdPartyId, date, items, taxRate, role} = o;
  if(!can(role,'ventas','CREATE')) throw new Error('Tu rol no tiene permiso para crear facturas de venta.');
  if(!thirdPartyId) throw new Error('Selecciona un cliente.');
  if(!items || !items.length) throw new Error('Agrega al menos un producto o servicio a la factura.');
  let subtotal=0, cost=0;
  const detailed = items.map(it=>{
    const p = product(it.productId);
    if(!p) throw new Error('Producto no encontrado.');
    if(p.type==='PRODUCT' && p.stock < it.qty){
      throw new Error('Stock insuficiente de "'+p.name+'": disponible '+fmtNum(p.stock)+' '+p.unit+', solicitado '+fmtNum(it.qty)+'.');
    }
    const lineTotal = it.qty*it.unitPrice;
    subtotal += lineTotal;
    if(p.type==='PRODUCT') cost += it.qty*p.avgCost;
    return {...it, product:p, lineTotal};
  });
  subtotal = Math.round(subtotal); cost=Math.round(cost);
  const taxAmount = Math.round(subtotal*taxRate);
  const total = subtotal+taxAmount;
  const tp = thirdParty(thirdPartyId);
  const lines = [
    {accountCode:'1305', thirdPartyId, debit: total, credit:0, note:'Cartera cliente'},
    {accountCode:'240805', debit:0, credit: taxAmount, note:'IVA generado 19%'},
    {accountCode:'4135', debit:0, credit: subtotal, note:'Ingreso operacional'},
  ];
  if(cost>0){
    lines.push({accountCode:'6135', debit:cost, credit:0, note:'Costo de ventas'});
    lines.push({accountCode:'1435', debit:0, credit:cost, note:'Salida de inventario'});
  }
  const entry = postEntry({companyId, branchId, voucherType:'FV', date, concept:'Factura de venta a '+tp.name, lines, role, sourceType:'SALE'});
  const invoice = {
    id: uid('inv'), companyId, branchId, thirdPartyId, number:entry.number, date,
    items: detailed.map(d=>({productId:d.productId, name:d.product.name, qty:d.qty, unitPrice:d.unitPrice, total:d.lineTotal})),
    subtotal, taxAmount, total, paidAmount:0, entryId:entry.id,
  };
  DB.invoices.push(invoice);
  detailed.forEach(d=>{
    if(d.product.type==='PRODUCT'){
      const before = d.product.stock;
      d.product.stock -= d.qty;
      DB.inventoryMovements.push({id:uid('mv'), companyId, productId:d.productId, type:'OUT', qty:d.qty, unitCost:d.product.avgCost,
        totalValue: Math.round(d.qty*d.product.avgCost), stockBefore:before, stockAfter:d.product.stock, date, ref:invoice.number, entryId:entry.id});
    }
  });
  addAudit(companyId,'Ventas','Emitió factura de venta '+invoice.number+' a '+tp.name+' por '+fmtMoney(total), role);
  save();
  return invoice;
}

function createPurchaseBill(o){
  const {companyId, branchId, thirdPartyId, date, items, taxRate, role} = o;
  if(!can(role,'compras','CREATE')) throw new Error('Tu rol no tiene permiso para registrar facturas de compra.');
  if(!thirdPartyId) throw new Error('Selecciona un proveedor.');
  if(!items || !items.length) throw new Error('Agrega al menos un producto o servicio a la factura.');
  let subtotal=0;
  const detailed = items.map(it=>{
    const p = product(it.productId);
    if(!p) throw new Error('Producto no encontrado.');
    const lineTotal = it.qty*it.unitCost;
    subtotal += lineTotal;
    return {...it, product:p, lineTotal};
  });
  subtotal = Math.round(subtotal);
  const taxAmount = Math.round(subtotal*taxRate);
  const total = subtotal+taxAmount;
  const tp = thirdParty(thirdPartyId);
  const invAccount = detailed.some(d=>d.product.type==='PRODUCT') ? '1435' : '5195';
  const lines = [
    {accountCode:invAccount, debit: subtotal, credit:0, note:'Entrada de inventario / gasto'},
    {accountCode:'135515', debit: taxAmount, credit:0, note:'IVA descontable'},
    {accountCode:'2205', thirdPartyId, debit:0, credit: total, note:'Cuenta por pagar proveedor'},
  ];
  const entry = postEntry({companyId, branchId, voucherType:'FC', date, concept:'Factura de compra de '+tp.name, lines, role, sourceType:'PURCHASE'});
  const bill = {
    id: uid('bill'), companyId, branchId, thirdPartyId, number:entry.number, date,
    items: detailed.map(d=>({productId:d.productId, name:d.product.name, qty:d.qty, unitCost:d.unitCost, total:d.lineTotal})),
    subtotal, taxAmount, total, paidAmount:0, entryId:entry.id,
  };
  DB.bills.push(bill);
  detailed.forEach(d=>{
    if(d.product.type==='PRODUCT'){
      const p=d.product; const before=p.stock;
      const newQty = p.stock + d.qty;
      const newCost = newQty>0 ? Math.round(((p.stock*p.avgCost)+(d.qty*d.unitCost))/newQty) : d.unitCost;
      p.stock = newQty; p.avgCost = newCost;
      DB.inventoryMovements.push({id:uid('mv'), companyId, productId:d.productId, type:'IN', qty:d.qty, unitCost:d.unitCost,
        totalValue: Math.round(d.qty*d.unitCost), stockBefore:before, stockAfter:p.stock, date, ref:bill.number, entryId:entry.id});
    }
  });
  addAudit(companyId,'Compras','Registró factura de compra '+bill.number+' de '+tp.name+' por '+fmtMoney(total), role);
  save();
  return bill;
}

/* ---------------------------- Tesorería --------------------------------------- */
function registerCollection(o){
  const {companyId, branchId, invoiceId, bankAccountId, amount, date, role} = o;
  if(!can(role,'tesoreria','CREATE')) throw new Error('Tu rol no tiene permiso para registrar recaudos.');
  const inv = DB.invoices.find(i=>i.id===invoiceId);
  if(!inv) throw new Error('Factura no encontrada.');
  const saldo = invoiceBalance(inv);
  if(amount<=0 || amount>saldo+1) throw new Error('El valor debe ser mayor a cero y no superar el saldo pendiente de '+fmtMoney(saldo)+'.');
  const tp = thirdParty(inv.thirdPartyId);
  const lines = [
    {accountCode:'1110', bankAccountId, debit:amount, credit:0, note:'Ingreso a banco'},
    {accountCode:'1305', thirdPartyId:inv.thirdPartyId, debit:0, credit:amount, note:'Abono cartera'},
  ];
  const entry = postEntry({companyId, branchId, voucherType:'CI', date, concept:'Recaudo factura '+inv.number+' — '+tp.name, lines, role, sourceType:'COLLECTION', sourceId:inv.id});
  inv.paidAmount += amount;
  addAudit(companyId,'Tesorería','Registró recaudo de '+fmtMoney(amount)+' de la factura '+inv.number, role);
  save();
  return entry;
}
function registerPayment(o){
  const {companyId, branchId, billId, bankAccountId, amount, date, role} = o;
  if(!can(role,'tesoreria','CREATE')) throw new Error('Tu rol no tiene permiso para registrar pagos.');
  const bill = DB.bills.find(b=>b.id===billId);
  if(!bill) throw new Error('Factura de compra no encontrada.');
  const saldo = billBalance(bill);
  if(amount<=0 || amount>saldo+1) throw new Error('El valor debe ser mayor a cero y no superar el saldo pendiente de '+fmtMoney(saldo)+'.');
  const tp = thirdParty(bill.thirdPartyId);
  const lines = [
    {accountCode:'2205', thirdPartyId:bill.thirdPartyId, debit:amount, credit:0, note:'Pago a proveedor'},
    {accountCode:'1110', bankAccountId, debit:0, credit:amount, note:'Salida de banco'},
  ];
  const entry = postEntry({companyId, branchId, voucherType:'CE', date, concept:'Pago factura '+bill.number+' — '+tp.name, lines, role, sourceType:'PAYMENT', sourceId:bill.id});
  bill.paidAmount += amount;
  addAudit(companyId,'Tesorería','Registró pago de '+fmtMoney(amount)+' de la factura '+bill.number, role);
  save();
  return entry;
}
function registerCashMovement(o){
  const {companyId, branchId, bankAccountId, direction, counterCode, amount, date, concept, role} = o;
  if(!can(role,'tesoreria','CREATE')) throw new Error('Tu rol no tiene permiso para registrar movimientos de tesorería.');
  if(amount<=0) throw new Error('El valor debe ser mayor a cero.');
  const lines = direction==='IN'
    ? [{accountCode:'1110', bankAccountId, debit:amount, credit:0},{accountCode:counterCode, debit:0, credit:amount}]
    : [{accountCode:counterCode, debit:amount, credit:0},{accountCode:'1110', bankAccountId, debit:0, credit:amount}];
  const entry = postEntry({companyId, branchId, voucherType: direction==='IN'?'CI':'CE', date, concept, lines, role, sourceType:'CASH_MOVEMENT'});
  addAudit(companyId,'Tesorería',(direction==='IN'?'Registró ingreso':'Registró egreso')+' de '+fmtMoney(amount)+' — '+concept, role);
  save();
  return entry;
}

function navBadges(){
  const cid = UI.companyId;

  const openInv = DB.invoices.filter(i=>i.companyId===cid && invoiceBalance(i)>0).length;
  const openBills = DB.bills.filter(b=>b.companyId===cid && billBalance(b)>0).length;
  const low = productsOf(cid).filter(p=>p.type==='PRODUCT' && p.stock<=15).length;
  return {
    comprobantes: drafts ? `<span class="nav-badge warn" title="${drafts} en borrador">${drafts}</span>` : '',
    ventas: openInv ? `<span class="nav-badge" title="${openInv} factura(s) por cobrar">${openInv}</span>` : '',

    inventario: low ? `<span class="nav-dot" title="${low} producto(s) con stock bajo"></span>` : '',

}

/* ---------------------------- Apariencia (tema y transparencia) ------------------- */
const PREFS_KEY = 'contafi_ui_prefs';
function loadPrefs(){ try{ return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; }catch(e){ return {}; } }
function savePrefs(){ try{ localStorage.setItem(PREFS_KEY, JSON.stringify({theme:UI.theme, glass:UI.glass})); }catch(e){ /* sin almacenamiento */ } }
function applyAppearance(){
  const root = document.documentElement;
  root.setAttribute('data-theme', UI.theme);
  root.setAttribute('data-glass', UI.glass);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', UI.theme==='dark' ? '#060B0B' : '#DCE6E3');
  document.querySelectorAll('[data-theme-btn]').forEach(b=>{
    const l = UI.theme==='dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro';
    b.innerHTML = icon(UI.theme==='dark'?'sun':'moon'); b.title = l; b.setAttribute('aria-label', l);
  });
  document.querySelectorAll('[data-glass-btn]').forEach(b=>{
    const off = UI.glass==='off';
    const l = off ? 'Activar efecto de vidrio' : 'Reducir transparencia';
    b.innerHTML = icon('droplet'); b.title = l; b.setAttribute('aria-label', l);
    b.setAttribute('aria-pressed', off?'true':'false'); b.classList.toggle('on', off);
  });
}

/* ---------------------------- Bloqueo de roles por contraseña -------------------- */
App.requestRoleSwitch = function(role){
  if(role===UI.role) return;
  if(!roleHasPassword(role) || UI.unlockedRoles.has(role)){
    App.setRole(role);
    return;
  }
  App.openRolePasswordModal(role);
};
App.openRolePasswordModal = function(role){
  App.openModal('Acceso protegido — '+ROLE_LABELS[role], `
    <div class="notice info">El rol <b>${ROLE_LABELS[role]}</b> está protegido con contraseña. Ingrésala para continuar; se te pedirá una sola vez por sesión de navegador.</div>
    ${pwFieldHtml('fRolePass','Contraseña','Contraseña del rol '+ROLE_LABELS[role], {onEnter:"App.submitRolePassword('"+role+"')"})}
    <div id="rolePassError" class="notice danger" style="display:none;"></div>
    <div class="tag-line">¿La olvidaste? Pide a un Super administrador que la consulte o la reinicie en Configuración → Seguridad de roles.</div>
  `, `<button class="btn" onclick="App.cancelRoleSwitch()">Cancelar</button><button class="btn primary" onclick="App.submitRolePassword('${role}')">Ingresar</button>`);
  setTimeout(()=>{ const i=document.getElementById('fRolePass'); if(i) i.focus(); }, 30);
};
App.cancelRoleSwitch = function(){
  App.closeModal();
  const sel = document.getElementById('roleSelect');
  if(sel) sel.value = UI.role;
};
App.submitRolePassword = function(role){
  const input = document.getElementById('fRolePass');
  const pass = input ? input.value : '';
  if(simpleHash(pass) === DB.roleAuth[role].hash){
    UI.unlockedRoles.add(role);
    addAudit(UI.companyId, 'Seguridad', 'Acceso concedido al rol '+ROLE_LABELS[role]+' (contraseña correcta)', role);
    save();
    App.closeModal();
    App.setRole(role);
  }else{
    addAudit(UI.companyId, 'Seguridad', 'Intento fallido de acceso al rol '+ROLE_LABELS[role], UI.role);
    save();
    const err = document.getElementById('rolePassError');
    if(err){ err.style.display='block'; err.textContent='Contraseña incorrecta. Inténtalo de nuevo.'; }
    if(input){ input.value=''; input.focus(); }
    toast('Contraseña incorrecta para el rol '+ROLE_LABELS[role]+'.','danger');
  }
};
App.logout = function(){
  UI.unlockedRoles.delete(UI.role);
  addAudit(UI.companyId, 'Seguridad', 'Cerró sesión del rol '+ROLE_LABELS[UI.role], UI.role);
  save();
  if(UI.chartRef){ UI.chartRef.destroy(); UI.chartRef=null; }
  if(UI.chartRef2){ UI.chartRef2.destroy(); UI.chartRef2=null; }
  toast('Sesión finalizada.');
  renderLogin();
};
App.navigate = function(route){
  UI.route = route; UI.sidebarOpen=false; UI.navFilter='';
  const ns = document.getElementById('navSearch'); if(ns) ns.value='';

function ensureModalHost(){
  let h = document.getElementById('modalHost');

App.openModal = function(title, bodyHtml, footHtml, opts){

  host.innerHTML = `<div class="modal-back" id="modalBack" onmousedown="if(event.target.id==='modalBack')App.closeModal()">

App.togglePwVisibility = function(id, btn){

/* ---------------------------- Componentes compartidos ------------------------ */
function pill(status){
  const map = {POSTED:['posted','Contabilizado'], DRAFT:['draft','Borrador'], ANNULLED:['annulled','Anulado'],
    paid:['paid','Pagada'], partial:['partial','Parcial'], open:['open','Pendiente'],
    OPEN:['open','Abierto'], CLOSED:['closed','Cerrado']};
  const m = map[status] || ['open', status];
  return `<span class="pill ${m[0]}">${m[1]}</span>`;
}
function emptyRow(colspan, text){ return `<tr><td colspan="${colspan}"><div class="empty">${esc(text)}</div></td></tr>`; }
/* Tarjetas de indicadores. Cada ítem: {label, value | money, cls, icon, tone, sub, badge:[clase, texto]} */
function kpiStrip(items){
  return `<div class="kpi-grid">${items.map(i=>{
    const val = i.money!==undefined ? moneyHtml(i.money) : String(i.value).replace(/^(-?)\$\s*/, (m,neg)=>`<span class="cur">${neg?'−':''}$</span>`);
    return `<div class="kpi-card">
      <div class="kpi-top">${i.icon?`<span class="kpi-ic ${i.tone||''}">${icon(i.icon)}</span>`:''}<span class="kpi-label">${esc(i.label)}</span></div>
      <div class="kpi-value ${i.cls||''}">${val}</div>
      ${i.sub||i.badge?`<div class="kpi-foot"><span class="kpi-sub">${esc(i.sub||'')}</span>${i.badge?`<span class="pill ${i.badge[0]}">${esc(i.badge[1])}</span>`:''}</div>`:''}
    </div>`;
  }).join('')}</div>`;
}
function vtag(t){ return `<span class="vtag t-${esc(t)}">${esc(t)}</span>`; }

/* Composición de costos (clase 6) y gastos (clase 5) por cuenta, mayores primero. */
function expenseComposition(cid, branchId){
  return leafAccounts(cid).filter(a=>a.code.startsWith('5')||a.code.startsWith('6'))
    .map(a=>({code:a.code, name:(a.code.startsWith('6')?'Costo de ventas · ':'')+a.name, val:accountBalance(cid,a.code,branchId).balance}))
    .filter(x=>x.val>0).sort((a,b)=>b.val-a.val).slice(0,6);
}

function fmtAxis(v){
  const a = Math.abs(v);
  if(a>=1e6) return (v/1e6).toLocaleString('es-CO',{maximumFractionDigits:1})+' M';
  if(a>=1e3) return (v/1e3).toLocaleString('es-CO',{maximumFractionDigits:0})+' mil';
  return String(v);
}
function refreshCharts(){
  if(UI.route!=='dashboard' || !window.Chart) return;
  const cid = UI.companyId;
  const months = [];
  for(let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); months.push(d.toISOString().slice(0,7)); }
  const rev = months.map(ym=>{
    let ingresos=0, costosGastos=0;
    DB.entries.filter(e=>e.companyId===cid && e.status==='POSTED' && e.date.slice(0,7)===ym && (UI.branchId==='ALL'||e.branchId===UI.branchId))
      .forEach(e=>e.lines.forEach(l=>{
        if(l.accountCode.startsWith('4')) ingresos += (l.credit-l.debit);
        if(l.accountCode.startsWith('5')||l.accountCode.startsWith('6')) costosGastos += (l.debit-l.credit);
      }));
    return {ym, ingresos, costosGastos};
  });
  const inkSoft = cssVar('--ink-soft'), line = cssVar('--line'), accent = cssVar('--accent'), credit = cssVar('--credit');
  const tooltip = {backgroundColor:cssVar('--toast-bg'), titleColor:cssVar('--toast-ink'), bodyColor:cssVar('--toast-ink'), padding:10, cornerRadius:12, boxPadding:4,
    callbacks:{label:ctx=>' '+(ctx.dataset.label||ctx.label)+': '+fmtMoney(ctx.parsed.y!==undefined?ctx.parsed.y:ctx.parsed)}};
  Chart.defaults.font.family = "'Geist', ui-sans-serif, system-ui, sans-serif";
  Chart.defaults.color = inkSoft;

  const c1 = document.getElementById('chartRevenue');
  if(c1){
    if(UI.chartRef) UI.chartRef.destroy();
    const bar = {borderRadius:6, borderSkipped:false, maxBarThickness:26, categoryPercentage:.6, barPercentage:.82};
    UI.chartRef = new Chart(c1, {
      type:'bar',
      data:{ labels:rev.map(r=>monthLabel(r.ym).split(' ')[0]), datasets:[
        Object.assign({label:'Ingresos', data:rev.map(r=>r.ingresos), backgroundColor:accent}, bar),
        Object.assign({label:'Costo + gastos', data:rev.map(r=>r.costosGastos), backgroundColor:credit}, bar),
      ]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip},
        scales:{ x:{grid:{display:false}, border:{display:false}, ticks:{font:{size:12}}},
                 y:{beginAtZero:true, grid:{color:line}, border:{display:false}, ticks:{font:{size:11}, maxTicksLimit:5, callback:v=>fmtAxis(v)}} } }
    });
  }
  const c2 = document.getElementById('chartExpense');
  if(c2){
    if(UI.chartRef2) UI.chartRef2.destroy();
    const exp = expenseComposition(cid, UI.branchId);
    UI.chartRef2 = new Chart(c2, {
      type:'doughnut',
      data:{ labels:exp.map(x=>x.name), datasets:[{data:exp.map(x=>x.val), backgroundColor:exp.map((x,i)=>cssVar(SERIES_VARS[i])), borderWidth:0, spacing:3, borderRadius:4}] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'70%', plugins:{legend:{display:false}, tooltip} }
    });
  }
}

App.saveAccount = function(){
  const code = modalBody().querySelector('#fAcctCode').value.trim();
  const name = modalBody().querySelector('#fAcctName').value.trim();
  const nature = modalBody().querySelector('#fAcctNature').value;
  const rtp = modalBody().querySelector('#fAcctRtp').checked;
  if(!/^[0-9]{1,8}$/.test(code)) return toast('El código debe ser numérico.','danger');
  if(!name) return toast('Ingresa el nombre de la cuenta.','danger');
  if(accByCode(UI.companyId, code)) return toast('Ya existe una cuenta con ese código.','danger');
  const level = code.length===1?1:code.length===2?2:code.length===4?3:code.length===6?4:5;
  DB.accounts.push({id:uid('acc'), companyId:UI.companyId, code, name, nature, level, requiresThirdParty:rtp, isActive:true});
  addAudit(UI.companyId,'Contabilidad','Creó la cuenta '+code+' — '+name, UI.role);
  save(); App.closeModal(); rerender(); toast('Cuenta creada correctamente.','ok');
};

App.saveProduct = function(productId){
  const b = modalBody();
  if(productId){
    if(!can(UI.role,'inventario','CREATE')) return toast('Tu rol no tiene permiso para editar productos.','danger');
    const p = product(productId); if(!p) return;
    const name = b.querySelector('#fPrName').value.trim();
    const sku = b.querySelector('#fPrSku').value.trim();
    if(!name || !sku) return toast('SKU y nombre son obligatorios.','danger');
    if(DB.products.find(x=>x.companyId===p.companyId && x.sku===sku && x.id!==productId)) return toast('Ya existe un producto con ese SKU.','danger');
    const hasMoves = DB.inventoryMovements.some(m=>m.productId===productId);
    p.sku = sku; p.name = name;
    p.unit = b.querySelector('#fPrUnit').value.trim()||'UND';
    p.salePrice = Math.max(0, Number(b.querySelector('#fPrPrice').value)||0);
    if(!hasMoves){
      p.type = b.querySelector('#fPrType').value;
      p.stock = p.type==='PRODUCT' ? Math.max(0, Number(b.querySelector('#fPrStock').value)||0) : 0;
      p.avgCost = p.type==='PRODUCT' ? Math.max(0, Number(b.querySelector('#fPrCost').value)||0) : 0;
    }
    addAudit(UI.companyId,'Inventario','Editó el producto '+sku+' — '+name, UI.role);
    save(); App.closeModal(); rerender(); toast('Producto actualizado correctamente.','ok');
    return;
  }
  const name = b.querySelector('#fPrName').value.trim();
  const sku = b.querySelector('#fPrSku').value.trim();
  if(!name || !sku) return toast('SKU y nombre son obligatorios.','danger');
  const type = b.querySelector('#fPrType').value;
  const stock = type==='PRODUCT' ? Math.max(0, Number(b.querySelector('#fPrStock').value)||0) : 0;
  const avgCost = type==='PRODUCT' ? Math.max(0, Number(b.querySelector('#fPrCost').value)||0) : 0;
  DB.products.push({id:uid('pr'), companyId:UI.companyId, sku, name, type, unit:b.querySelector('#fPrUnit').value.trim()||'UND',
    stock, avgCost, salePrice: Math.max(0, Number(b.querySelector('#fPrPrice').value)||0)});
  addAudit(UI.companyId,'Inventario','Creó el producto '+sku+' — '+name, UI.role);
  save(); App.closeModal(); rerender(); toast('Producto creado correctamente.','ok');
};
App.deleteProduct = function(productId){
  if(!can(UI.role,'inventario','FULL')) return toast('Tu rol no tiene permiso para eliminar productos.','danger');
  const p = product(productId);
  if(!p) return;
  const used = DB.inventoryMovements.some(m=>m.productId===productId)
    || DB.invoices.some(i=>i.items.some(it=>it.productId===productId))
    || DB.bills.some(b=>b.items.some(it=>it.productId===productId));
  if(used) return toast('No se puede eliminar "'+p.name+'": tiene movimientos o documentos asociados. Puedes editarlo, pero no eliminarlo para conservar la trazabilidad.','danger');
  if(!confirm('¿Eliminar el producto "'+p.name+'"? Esta acción no se puede deshacer.')) return;
  DB.products = DB.products.filter(x=>x.id!==productId);
  addAudit(UI.companyId,'Inventario','Eliminó el producto '+p.sku+' — '+p.name, UI.role);
  save(); rerender(); toast('Producto eliminado correctamente.','ok');
};

App.recalcInvoice = function(){
  const rows = modalBody().querySelectorAll('#invItemsBody tr');
  let subtotal=0;
  rows.forEach(r=>{
    const qty = Number(r.querySelector('td:nth-child(2) input').value)||0;
    const price = Number(r.querySelector('td:nth-child(3) input').value)||0;
    const t = qty*price; subtotal += t;
    r.querySelector('.line-total').textContent = fmtMoney(t);
  });
  const tax = Math.round(subtotal*0.19); const total = subtotal+tax;
  modalBody().querySelector('#invSubtotal').textContent = fmtMoney(subtotal);
  modalBody().querySelector('#invTax').textContent = fmtMoney(tax);
  modalBody().querySelector('#invTotal').textContent = fmtMoney(total);
};

App.recalcBill = function(){
  const rows = modalBody().querySelectorAll('#billItemsBody tr');
  let subtotal=0;
  rows.forEach(r=>{
    const qty = Number(r.querySelector('td:nth-child(2) input').value)||0;
    const cost = Number(r.querySelector('td:nth-child(3) input').value)||0;
    const t = qty*cost; subtotal+=t;
    r.querySelector('.line-total').textContent = fmtMoney(t);
  });
  const tax = Math.round(subtotal*0.19); const total = subtotal+tax;
  modalBody().querySelector('#billSubtotal').textContent = fmtMoney(subtotal);
  modalBody().querySelector('#billTax').textContent = fmtMoney(tax);
  modalBody().querySelector('#billTotal').textContent = fmtMoney(total);
};

  try{
    createPurchaseBill({companyId:UI.companyId, branchId:b.querySelector('#fBillBranch').value, thirdPartyId:b.querySelector('#fBillSupplier').value,

};

App._entryRowHtml = function(){ const n=modalBody().querySelectorAll('#entryLinesBody tr').length; return entryLineRow(n, leafAccounts(UI.companyId)); };
App.recalcEntry = function(){
  const rows = modalBody().querySelectorAll('#entryLinesBody tr');
  let d=0,c=0;
  rows.forEach(r=>{ d+= Number(r.querySelector('td:nth-child(3) input').value)||0; c+= Number(r.querySelector('td:nth-child(4) input').value)||0; });
  modalBody().querySelector('#enDeb').textContent = fmtMoney(d);
  modalBody().querySelector('#enCred').textContent = fmtMoney(c);
  const msg = modalBody().querySelector('#enBalanceMsg');
  if(d===c && d>0){ msg.textContent='Balanceado ✓'; msg.className='balance-ok'; }
  else{ msg.textContent='Diferencia: '+fmtMoney(Math.abs(d-c)); msg.className='balance-bad'; }
};
App.submitEntry = function(){
  const b = modalBody();
  const rows = b.querySelectorAll('#entryLinesBody tr');
  const lines = [];
  rows.forEach(r=>{
    const code = r.querySelector('select').value;
    const debit = Number(r.querySelector('td:nth-child(3) input').value)||0;
    const credit = Number(r.querySelector('td:nth-child(4) input').value)||0;
    const note = r.querySelector('td:nth-child(2) input').value.trim();
    if(debit>0||credit>0) lines.push({accountCode:code, debit, credit, note});
  });
  const concept = b.querySelector('#fEnConcept').value.trim();
  if(!concept) return toast('Ingresa el concepto del comprobante.','danger');
  try{
    postEntry({companyId:UI.companyId, branchId:b.querySelector('#fEnBranch').value, voucherType:'CG', date:b.querySelector('#fEnDate').value, concept, lines, role:UI.role});
    App.closeModal(); rerender(); toast('Comprobante guardado correctamente.','ok');
  }catch(err){ toast(err.message,'danger'); }
};

let CHAT_LOG = [{who:'bot', text:'Hola, soy el asistente financiero de Contafi. Puedo responder preguntas sobre cartera, cuentas por pagar, caja, bancos, inventario, IVA, ingresos, gastos y utilidad de '+"'"+'Comercializadora Andina'+"'"+'. ¿Qué deseas consultar?'}];
ROUTE_RENDER.asistente = function(){
  const chips = ['¿Cuál es mi cartera pendiente?','¿Cuánto tengo en bancos?','¿Cuál es la utilidad del período?','¿Cuánto debo a proveedores?','¿Cuánto IVA he generado?','¿Qué productos tienen poco stock?'];

      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Escribe tu pregunta financiera…" onkeydown="if(event.key==='Enter'){App.askAssistant(this.value); this.value='';}">

      </div>
    </div>
  </div>
  <div class="notice info">Este asistente calcula respuestas directamente desde los libros contables locales (no usa un modelo externo). En producción, este módulo se conectaría a un motor de lenguaje natural sobre el mismo API-First descrito en la arquitectura.</div>`;
};
App.askAssistant = function(q){
  q = (q||'').trim(); if(!q) return;
  CHAT_LOG.push({who:'user', text:esc(q)});
  CHAT_LOG.push({who:'bot', text:answerFinance(q)});
  if(CHAT_LOG.length>40) CHAT_LOG = CHAT_LOG.slice(-40);
  rerender();
  setTimeout(()=>{ const log=document.getElementById('chatLog'); if(log) log.scrollTop = log.scrollHeight; }, 30);
};
function answerFinance(qRaw){
  const q = qRaw.toLowerCase();
  const cid = UI.companyId;
  const has = (...ws)=> ws.some(w=>q.includes(w));
  if(has('cartera','cxc','cobrar')){
    const total = DB.invoices.filter(i=>i.companyId===cid).reduce((s,i)=>s+invoiceBalance(i),0);
    const n = DB.invoices.filter(i=>i.companyId===cid && invoiceBalance(i)>0).length;
    return 'Tu cartera pendiente por cobrar es de <b>'+fmtMoney(total)+'</b>, distribuida en '+n+' factura(s) sin saldar.';
  }
  if(has('cxp','proveedor','pagar')){
    const total = DB.bills.filter(b=>b.companyId===cid).reduce((s,b)=>s+billBalance(b),0);
    const n = DB.bills.filter(b=>b.companyId===cid && billBalance(b)>0).length;
    return 'Debes a proveedores <b>'+fmtMoney(total)+'</b>, en '+n+' factura(s) de compra pendientes.';
  }
  if(has('banco','bancos')){
    const total = bankAccountsOf(cid).reduce((s,b)=>s+bankBalance(b.id),0);
    return 'El saldo total en cuentas bancarias es de <b>'+fmtMoney(total)+'</b>, distribuido en '+bankAccountsOf(cid).length+' cuenta(s).';
  }
  if(has('caja')){
    return 'El saldo actual de Caja General es de <b>'+fmtMoney(accountBalance(cid,'1105').balance)+'</b>.';
  }
  if(has('utilidad','ganancia','perdid','resultado')){
    const is = incomeStatement(cid, 'ALL');
    return (is.utilidadNeta>=0?'La utilidad':'La pérdida')+' acumulada del ejercicio es de <b>'+fmtMoney(Math.abs(is.utilidadNeta))+'</b> (ingresos '+fmtMoney(is.ingresos)+' − costos '+fmtMoney(is.costos)+' − gastos '+fmtMoney(is.gastos)+').';
  }
  if(has('iva')){
    const gen = accountBalance(cid,'240805').balance;
    const desc = accountBalance(cid,'135515').balance;
    return 'IVA generado en ventas: <b>'+fmtMoney(-gen)+'</b>. IVA descontable en compras: <b>'+fmtMoney(desc)+'</b>. Saldo neto por pagar a la DIAN: <b>'+fmtMoney(-gen-desc)+'</b>.';
  }
  if(has('stock','inventario','existencia')){
    const low = productsOf(cid).filter(p=>p.type==='PRODUCT' && p.stock<=15);
    if(!low.length) return 'Todos los productos tienen niveles de inventario saludables (más de 15 unidades).';
    return 'Productos con inventario bajo: '+low.map(p=>esc(p.name)+' ('+fmtNum(p.stock)+' und.)').join(', ')+'.';
  }
  if(has('activo')){
    return 'El total de activos de la compañía es <b>'+fmtMoney(balanceSheet(cid,'ALL').activo)+'</b>.';
  }
  if(has('pasivo')){
    return 'El total de pasivos de la compañía es <b>'+fmtMoney(balanceSheet(cid,'ALL').pasivo)+'</b>.';
  }
  if(has('patrimonio')){
    return 'El patrimonio actual (incluida la utilidad del ejercicio) es de <b>'+fmtMoney(balanceSheet(cid,'ALL').patrimonio)+'</b>.';
  }
  if(has('ingreso','venta','factur')){
    const is = incomeStatement(cid,'ALL');
    return 'Los ingresos operacionales acumulados suman <b>'+fmtMoney(is.ingresos)+'</b>, provenientes de '+DB.invoices.filter(i=>i.companyId===cid).length+' factura(s) de venta.';
  }
  return 'No tengo una respuesta calculada para esa pregunta todavía. Puedo ayudarte con cartera, cuentas por pagar, bancos, caja, IVA, inventario, activos, pasivos, patrimonio y utilidad. Prueba con una de las sugerencias debajo del chat.';
}

      <div class="notice warn">Esta protección es un control de acceso del lado del navegador, pensado para evitar que alguien cambie de rol por descuido o sin autorización. No es un sistema de autenticación de servidor. Como privilegio del Super administrador, las contraseñas se guardan también en texto legible (además de un hash) para poder consultarlas o restablecerlas aquí mismo — ten en cuenta que eso también significa que, técnicamente, no están cifradas de forma irreversible.</div>
    </div>
    <div class="table-wrap"><table><thead><tr><th>Rol</th><th>Estado</th><th>Sesión</th><th></th></tr></thead><tbody>
    ${ROLES.map(r=>{
      const hasPass = roleHasPassword(r);
      const unlocked = UI.unlockedRoles.has(r);
      const canManage = can(UI.role,'configuracion','FULL');
      return `<tr><td style="font-weight:600;">${ROLE_LABELS[r]}</td>
        <td>${hasPass?'<span class="pill closed">Protegido</span>':'<span class="pill open">Sin contraseña</span>'}</td>
        <td>${unlocked?'<span class="pill posted">Desbloqueado</span>':'<span class="pill draft">Bloqueado</span>'}</td>
        <td class="btn-row">
          ${hasPass?`<button class="btn ghost sm" ${canManage?'':'disabled'} onclick="App.revealRolePassword('${r}')">Ver contraseña</button>`:''}
          <button class="btn ghost sm" ${canManage?'':'disabled'} onclick="App.openSetPasswordModal('${r}')">${hasPass?'Cambiar':'Establecer'}</button>
          ${hasPass?`<button class="btn danger sm" ${canManage?'':'disabled'} onclick="App.removeRolePassword('${r}')">Quitar</button>`:''}
        </td></tr>`;
    }).join('')}
    </tbody></table></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2>Matriz de roles y permisos (RBAC)</h2><span class="hint">Nivel mínimo requerido por módulo</span></div>
    <div class="table-wrap"><table><thead><tr><th>Rol</th><th>Contabilidad</th><th>Ventas/CxC</th><th>Compras/CxP</th><th>Tesorería</th><th>Nómina</th><th>Cierres</th><th>Auditoría</th></tr></thead><tbody>
    ${ROLES.map(r=>`<tr><td style="font-weight:600;">${ROLE_LABELS[r]}</td>
      <td>${PERMS[r].contabilidad}</td><td>${PERMS[r].ventas}</td><td>${PERMS[r].compras}</td><td>${PERMS[r].tesoreria}</td>
      <td>${PERMS[r].nomina}</td><td>${PERMS[r].cierres}</td><td>${PERMS[r].auditoria}</td></tr>`).join('')}
    </tbody></table></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2>Datos de la aplicación</h2></div>
    <div class="panel-body">
      <p style="color:var(--ink-soft); font-size:12.5px; max-width:600px;">Toda la información de esta demostración se guarda únicamente en el almacenamiento local de tu navegador. Ningún dato se envía a servidores externos.</p>
      <button class="btn danger sm" onclick="if(confirm('¿Reiniciar todos los datos a la demostración inicial? Esta acción no se puede deshacer.')) resetAll();">Reiniciar datos de demostración</button>
    </div>
  </div>`;
};
